<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TX Scorecard — BUY / LIST / SELL</title>
  <style>
    :root{--bg:#f6f8fb;--panel:#fff;--ink:#101828;--muted:#667085;--line:#d9e0ea;--blue:#2457c5;--green:#12805c;--gold:#b26a00;--red:#b42318;--purple:#6941c6;--cyan:#067a91;--shadow:0 14px 34px rgba(16,24,40,.07)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5}
    main{width:min(1520px,calc(100% - 48px));margin:0 auto;padding:32px 0 80px}
    a{color:var(--blue);font-weight:850;text-decoration:none}a:hover{text-decoration:underline}
    section{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:28px 30px;margin-bottom:18px}
    .eyebrow{margin:0 0 8px;color:var(--cyan);font-size:12px;font-weight:950;letter-spacing:.08em;text-transform:uppercase}
    h1,h2,h3,p{margin-top:0}h1{font-size:clamp(36px,5vw,58px);line-height:.98;margin-bottom:14px}h2{font-size:clamp(24px,2.8vw,34px);line-height:1.1;margin-bottom:10px}h3{font-size:19px;margin-bottom:10px}
    .sub{color:var(--muted);font-size:17px;max-width:1040px;line-height:1.55}.small{color:var(--muted);font-size:13px}
    .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
    .card{border:1px solid var(--line);border-radius:10px;background:#fff;padding:18px}.card strong{display:block;margin-bottom:6px;font-size:22px;line-height:1.1}.card p{margin:0;color:var(--muted)}.card small{display:block;margin-bottom:6px;color:var(--muted);font-size:11px;font-weight:950;letter-spacing:.06em;text-transform:uppercase}
    .metric strong{font-size:29px}
    .band{border-radius:8px;padding:13px 16px;font-weight:900;line-height:1.5}.band.gold{background:#fff4e5;color:#7c3e00}.band.blue{background:#eff6ff;color:#1d4ed8}.band.green{background:#ecfdf3;color:#067647}.band.red{background:#fef3f2;color:#b42318}
    .tableWrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #edf1f6;padding:12px 14px;text-align:left;vertical-align:top;font-size:14px}th{background:#f3f6fb;color:#344054;font-size:11px;font-weight:950;letter-spacing:.06em;text-transform:uppercase;position:sticky;top:0;z-index:1}tr:last-child td{border-bottom:none}
    .tag{display:inline-flex;align-items:center;min-height:24px;border-radius:999px;padding:0 10px;border:1px solid var(--line);background:#f8fafc;color:#344054;font-size:11px;font-weight:900}.ok{background:#ecfdf3;color:#067647;border-color:#abefc6}.warn{background:#fffaeb;color:#b54708;border-color:#fedf89}.bad{background:#fef3f2;color:#b42318;border-color:#fecdca}
    .real{display:inline-flex;align-items:center;min-height:20px;border-radius:4px;padding:0 7px;background:#ecfdf3;color:#067647;font-size:10px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;margin-left:6px}
    .source-tag{display:inline-flex;align-items:center;min-height:20px;border-radius:4px;padding:0 7px;font-size:10px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;margin-right:6px}
    .source-snow{background:#eff6ff;color:#1d4ed8;border:1px solid #c7d7fe}
    .source-sfdc{background:#f4f0ff;color:#5925dc;border:1px solid #d9d6fe}
    tr.clickable{cursor:pointer;transition:background .1s}tr.clickable:hover{background:#f8fafc}
    @media(max-width:1080px){main{width:min(100% - 24px,1520px)}.grid2,.grid3,.grid4{grid-template-columns:1fr}}

    /* Pacing card */
    .pacing-card{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,#1e293b 0%,#0f172a 100%);color:#fff;border-radius:12px;padding:20px 28px;margin-bottom:18px;display:flex;flex-wrap:wrap;gap:20px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
    .pacing-card .pc-item{display:flex;flex-direction:column;gap:2px}.pacing-card .pc-label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#94a3b8}.pacing-card .pc-value{font-size:22px;font-weight:900;line-height:1.1}
    .pacing-card .pc-yoy{color:#4ade80}.pacing-card .pc-gap{color:#fb923c}
    .pacing-card .pc-divider{width:1px;height:40px;background:#334155;flex-shrink:0}

    /* Breadcrumb */
    .breadcrumb{display:flex;align-items:center;gap:8px;padding:12px 0;font-size:14px;font-weight:700;color:var(--muted);flex-wrap:wrap}
    .breadcrumb span{cursor:pointer;color:var(--blue);transition:color .1s}.breadcrumb span:hover{color:#1d4ed8;text-decoration:underline}
    .breadcrumb .bc-sep{color:var(--line);font-weight:400;cursor:default}.breadcrumb .bc-current{color:var(--ink);cursor:default}

    /* BUY/LIST/SELL sections */
    .bls-section{border-radius:12px;margin-bottom:14px;overflow:hidden;border:1px solid var(--line);background:#fff}
    .bls-section.buy{border-left:5px solid var(--blue)}.bls-section.list{border-left:5px solid var(--green)}.bls-section.sell{border-left:5px solid var(--purple)}
    .bls-header{padding:18px 24px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none;transition:background .1s}
    .bls-header:hover{background:#f8fafc}
    .bls-header h3{margin:0;font-size:18px;display:flex;align-items:center;gap:10px}
    .bls-header .bls-summary{font-size:14px;color:var(--muted);font-weight:600}
    .bls-body{display:none;padding:0 24px 24px;border-top:1px solid var(--line)}
    .bls-section.open .bls-body{display:block}
    .bls-arrow{font-size:14px;color:var(--muted);transition:transform .2s;flex-shrink:0;margin-left:12px}
    .bls-section.open .bls-arrow{transform:rotate(90deg)}

    /* Layers inside BLS */
    .layer{border:1px solid var(--line);border-radius:10px;margin:14px 0;overflow:hidden}
    .layer-header{padding:12px 16px;background:#f9fafb;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:800;user-select:none}
    .layer-header:hover{background:#f3f6fb}
    .layer-body{display:none;padding:14px 16px;border-top:1px solid #edf1f6}
    .layer.open .layer-body{display:block}
    .layer-arrow{font-size:12px;color:var(--muted);transition:transform .2s}
    .layer.open .layer-arrow{transform:rotate(90deg)}

    /* Nav table for drill-down */
    .drill-table tr.clickable td:first-child{color:var(--blue);font-weight:800}
    .drill-table .dept-badge{display:inline-flex;align-items:center;min-height:22px;border-radius:6px;padding:0 8px;font-size:11px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;margin-right:6px;background:#eff6ff;color:#1d4ed8;border:1px solid #c7d7fe}
    .acct-status{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700}
    .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
    .dot.green{background:#22c55e}.dot.yellow{background:#eab308}.dot.red{background:#ef4444}.dot.gray{background:#9ca3af}
    .mini-bar{display:flex;height:6px;border-radius:3px;overflow:hidden;min-width:60px;background:#e5e7eb}
    .mini-bar .fill{height:100%}.mini-bar .fill.blue{background:var(--blue)}.mini-bar .fill.green{background:var(--green)}.mini-bar .fill.purple{background:var(--purple)}
    .kpi-row{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0}
    .kpi-box{border:1px solid var(--line);border-radius:8px;padding:12px 16px;background:#fff;min-width:140px;flex:1}
    .kpi-box .kpi-label{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
    .kpi-box .kpi-val{font-size:24px;font-weight:900;line-height:1.1}
    .kpi-box .kpi-sub{font-size:12px;color:var(--muted);margin-top:2px}
    .diagnostic{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:12px 16px;margin:10px 0;font-size:14px;font-weight:600;color:#92400e}
    .diagnostic strong{color:#78350f}
    .back-link{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--blue);cursor:pointer;margin-bottom:12px}
    .back-link:hover{text-decoration:underline}
  </style>
</head>

// Aggregate by impl lead (department)
function getDepartments() {
  const map = {};
  ACCOUNTS.forEach(a => {
    const dept = a.impl || 'Unassigned';
    if (!map[dept]) map[dept] = {name:dept, accounts:[], pt:0, pk:0, po:0, ft:0, fe:0, fk:0, fa:0, gon:0, gk:0, goff:0, gt:0, k2k:0, av:0, as:0, ch:0};
    map[dept].accounts.push(a);
    map[dept].pt += a.pt; map[dept].pk += a.pk; map[dept].po += a.po;
    map[dept].ft += a.ft; map[dept].fe += a.fe; map[dept].fk += a.fk; map[dept].fa += a.fa;
    map[dept].gon += a.gon; map[dept].gk += a.gk; map[dept].goff += a.goff; map[dept].gt += a.gt;
    map[dept].k2k += a.k2k; map[dept].av += a.av; map[dept].as += a.as; map[dept].ch += a.ch;
  });
  return Object.values(map).sort((a,b) => b.ft - a.ft);
}

// Aggregate by CS rep within a department
function getRepsByDept(deptName) {
  const dept = getDepartments().find(d => d.name === deptName);
  if (!dept) return [];
  const map = {};
  dept.accounts.forEach(a => {
    const rep = a.cs || 'Unassigned';
    if (!map[rep]) map[rep] = {name:rep, accounts:[], pt:0, pk:0, po:0, ft:0, fe:0, fk:0, fa:0, gon:0, gk:0, goff:0, gt:0, k2k:0, av:0, as:0, ch:0};
    map[rep].accounts.push(a);
    map[rep].pt += a.pt; map[rep].pk += a.pk; map[rep].po += a.po;
    map[rep].ft += a.ft; map[rep].fe += a.fe; map[rep].fk += a.fk; map[rep].fa += a.fa;
    map[rep].gon += a.gon; map[rep].gk += a.gk; map[rep].goff += a.goff; map[rep].gt += a.gt;
    map[rep].k2k += a.k2k; map[rep].av += a.av; map[rep].as += a.as; map[rep].ch += a.ch;
  });
  return Object.values(map).sort((a,b) => b.ft - a.ft);
}

// Totals across all accounts
function getTotals() {
  const t = {pt:0,pk:0,po:0,ft:0,fe:0,fk:0,fa:0,gon:0,gk:0,goff:0,gt:0,k2k:0,av:0,as:0,ch:0,count:ACCOUNTS.length};
  ACCOUNTS.forEach(a => {
    t.pt+=a.pt; t.pk+=a.pk; t.po+=a.po; t.ft+=a.ft; t.fe+=a.fe; t.fk+=a.fk; t.fa+=a.fa;
    t.gon+=a.gon; t.gk+=a.gk; t.goff+=a.goff; t.gt+=a.gt; t.k2k+=a.k2k; t.av+=a.av; t.as+=a.as; t.ch+=a.ch;
  });
  return t;
}

// BUY status for an account or aggregate
function buyStatus(d) {
  const online = d.pk + (d.pt - d.pk - d.po);
  const pctOnline = d.pt > 0 ? ((d.pt - d.po) / d.pt * 100) : 0;
  return {online: d.pt - d.po, offline: d.po, total: d.pt, pctOnline};
}

function sellStatus(d) {
  const pctOnline = d.gt > 0 ? (d.gon / d.gt * 100) : 0;
  return {online: d.gon, k2k: d.gk, offline: d.goff, total: d.gt, fees: d.ft, pctOnline};
}

// Account BUY/LIST/SELL dot color
function statusDot(val, thresholds) {
  if (val >= thresholds[0]) return 'green';
  if (val >= thresholds[1]) return 'yellow';
  if (val > 0) return 'red';
  return 'gray';
}

// ============================================
// PACING CARD
// ============================================
function renderPacingCard() {
  // 2026 fees Jul 1-20
  const total2026 = FEES_2026_BY_INDUSTRY.reduce((s,r) => s + r.fees, 0);
  const total2025 = FEES_2025_BY_INDUSTRY.reduce((s,r) => s + r.fees, 0);
  const yoy = total2025 > 0 ? ((total2026 - total2025) / total2025 * 100) : 0;
  const daysElapsed = 20;
  const daysInQ = 92;
  const dailyRate = total2026 / daysElapsed;
  const projectedQ3 = dailyRate * daysInQ;
  const target = 670000;
  const neededRate = target / daysInQ;
  const pacing = (dailyRate / neededRate * 100);
  const gap = (dailyRate - neededRate) * (daysInQ - daysElapsed);

  return `<div class="pacing-card">
    <div class="pc-item"><span class="pc-label">Q3 Target</span><span class="pc-value">${fmtK(target)}</span></div>
    <div class="pc-divider"></div>
    <div class="pc-item"><span class="pc-label">Core MTD (Jul 1-20)</span><span class="pc-value">${fmtK(total2026)}</span></div>
    <div class="pc-divider"></div>
    <div class="pc-item"><span class="pc-label">YoY (same 20d)</span><span class="pc-value pc-yoy">+${yoy.toFixed(1)}%</span></div>
    <div class="pc-divider"></div>
    <div class="pc-item"><span class="pc-label">Daily Rate</span><span class="pc-value">${fmtK(dailyRate)}/d</span></div>
    <div class="pc-divider"></div>
    <div class="pc-item"><span class="pc-label">Needed Rate</span><span class="pc-value">${fmtK(neededRate)}/d</span></div>
    <div class="pc-divider"></div>
    <div class="pc-item"><span class="pc-label">Pacing</span><span class="pc-value ${pacing >= 100 ? 'pc-yoy' : 'pc-gap'}">${pacing.toFixed(1)}%</span></div>
    <div class="pc-divider"></div>
    <div class="pc-item"><span class="pc-label">Gap to Close</span><span class="pc-value pc-gap">${fmtK(Math.abs(gap))}</span></div>
    <div style="margin-left:auto;font-size:11px;color:#64748b">
      <span class="source-tag source-snow">SNOWFLAKE</span> EXPECTED_TRANSACTION_FEES + TRANSACTION_FEES<br>
      Jul 1-20, ks_flag=TRUE | <span class="real">REAL DATA</span>
    </div>
  </div>`;
}

        <td>${FEES_2026_BY_INDUSTRY.reduce((s,r)=>s+r.companies,0)}</td></tr>
      </table></div>
      <div class="diagnostic"><strong>Decomposition:</strong> Importers = ${fmtPct(69439/94385*100)} of fees, up +37.4% YoY. Wholesalers = ${fmtPct(20399/94385*100)}, up +54.0% YoY. Retailer fees are new in 2026. Growth is take-rate driven, not just volume.</div>
      <p class="small" style="margin-top:8px"><span class="source-tag source-snow">SNOWFLAKE</span> EXPECTED_TRANSACTION_FEES (2026) + TRANSACTION_FEES (2025), Jul 1-20, ks_flag=TRUE</p>
      </div></div>`;
  }

  return `<div class="bls-section sell" id="sell-section">
    <div class="bls-header" onclick="this.parentElement.classList.toggle('open')">
      <div>
        <h3><span style="color:var(--purple)">SELL</span> -- Tienen transacciones online?</h3>
        <div class="bls-summary">${fmtK(s.online)} online GMV | ${fmtPct(s.pctOnline)} online | ${fmtK(s.fees)} fees H1 | ${acctsSelling} accounts selling online</div>
      </div>
      <span class="bls-arrow">&#9654;</span>
    </div>
    <div class="bls-body">
      <div class="kpi-row">
        <div class="kpi-box"><div class="kpi-label">Online GMV</div><div class="kpi-val" style="color:var(--purple)">${fmtK(s.online)}</div><div class="kpi-sub">${fmtPct(s.pctOnline)} of total</div></div>
        <div class="kpi-box"><div class="kpi-label">K2K GMV</div><div class="kpi-val">${fmtK(s.k2k)}</div></div>
        <div class="kpi-box"><div class="kpi-label">Offline GMV</div><div class="kpi-val" style="color:var(--gold)">${fmtK(s.offline)}</div></div>
        <div class="kpi-box"><div class="kpi-label">Fees (H1 2026)</div><div class="kpi-val" style="color:var(--green)">${fmtK(s.fees)}</div></div>
        <div class="kpi-box"><div class="kpi-label">Accounts Selling Online</div><div class="kpi-val">${acctsSelling}</div><div class="kpi-sub">of ${acctCount}</div></div>
      </div>
      ${yoyLayer}
      <div class="layer"><div class="layer-header" onclick="this.parentElement.classList.toggle('open')">
        <span>Layer 2: GMV by Channel</span><span class="layer-arrow">&#9654;</span></div>
        <div class="layer-body"><div class="tableWrap">${gmvTable}</div></div></div>
      <div class="layer"><div class="layer-header" onclick="this.parentElement.classList.toggle('open')">
        <span>Layer 2b: Fees by Channel (H1 2026)</span><span class="layer-arrow">&#9654;</span></div>
        <div class="layer-body"><div class="tableWrap">${feesTable}</div></div></div>
      ${feeConcentration}
      ${soLayer}
      ${onlineSalesLayer}
    </div>
  </div>`;
}

// ============================================
// DRILL-DOWN TABLE
// ============================================
function renderDrillTable(items, type, clickFn) {
  return `<div class="tableWrap drill-table"><table>
    <tr><th>${type}</th><th>Accounts</th>
    <th style="border-left:3px solid var(--blue)">Buy Total</th><th>Buy % Digital</th>
    <th style="border-left:3px solid var(--green)">K2K Conns</th><th>Avail Vendors</th>
    <th style="border-left:3px solid var(--purple)">GMV Online</th><th>GMV Offline</th><th>Fees</th>
    <th>BUY</th><th>LIST</th><th>SELL</th></tr>
    ${items.map((d, i) => {
      const b = buyStatus(d);
      const s = sellStatus(d);
      const accts = d.accounts ? d.accounts.length : 1;
      const buyDot = statusDot(b.pctOnline, [20, 5]);
      const listDot = statusDot(d.k2k, [50, 10]);
      const sellDot = statusDot(s.pctOnline, [15, 3]);
      return `<tr class="clickable" onclick="${clickFn}('${d.name || d.n}')">
        <td style="font-weight:800;color:var(--blue)">${d.name || d.n}</td>
        <td>${accts}</td>
        <td>${fmtK(b.total)}</td><td>${fmtPct(b.pctOnline)}</td>
        <td>${fmtNum(d.k2k)}</td><td>${d.av != null ? fmtNum(d.av) : '—'}</td>
        <td>${fmtK(s.online)}</td><td>${fmtK(s.offline)}</td><td>${fmtK(s.fees)}</td>
        <td><span class="dot ${buyDot}"></span></td>
        <td><span class="dot ${listDot}"></span></td>
        <td><span class="dot ${sellDot}"></span></td>
      </tr>`;
    }).join('')}
  </table></div>`;
}

// ============================================
// VIEWS
// ============================================
let currentView = {level:'total', dept:null, rep:null, account:null};

function renderBreadcrumb() {
  const parts = [{label:'TX Total', level:'total'}];
  if (currentView.dept) parts.push({label:currentView.dept, level:'dept'});
  if (currentView.rep) parts.push({label:currentView.rep, level:'rep'});
  if (currentView.account) parts.push({label:currentView.account, level:'account'});

  return `<div class="breadcrumb">
    ${parts.map((p, i) => {
      const isLast = i === parts.length - 1;
      const sep = i > 0 ? '<span class="bc-sep">/</span>' : '';
      if (isLast) return `${sep}<span class="bc-current">${p.label}</span>`;
      return `${sep}<span onclick="navigateTo('${p.level}', ${p.level === 'dept' ? `'${currentView.dept}'` : 'null'}, ${p.level === 'rep' ? `'${currentView.rep}'` : 'null'})">${p.label}</span>`;
    }).join('')}
  </div>`;
}

function navigateTo(level, dept, rep) {
  if (level === 'total') { currentView = {level:'total', dept:null, rep:null, account:null}; }
  else if (level === 'dept') { currentView = {level:'dept', dept:dept, rep:null, account:null}; }
  else if (level === 'rep') { currentView = {level:'rep', dept:dept || currentView.dept, rep:rep, account:null}; }
  render();
}

function drillToDept(name) {
  currentView = {level:'dept', dept:name, rep:null, account:null};
  render();
}

function drillToRep(name) {
  currentView = {level:'rep', dept:currentView.dept, rep:name, account:null};
  render();
}

function drillToAccount(name) {
  currentView = {level:'account', dept:currentView.dept, rep:currentView.rep, account:name};
  render();
}

function render() {
  const app = document.getElementById('app');
  window.scrollTo(0, 0);

  if (currentView.level === 'total') {
    renderTotalView(app);
  } else if (currentView.level === 'dept') {
    renderDeptView(app);
  } else if (currentView.level === 'rep') {
    renderRepView(app);
  } else if (currentView.level === 'account') {
    renderAccountView(app);
  }
}

function renderTotalView(app) {
  const t = getTotals();
  const depts = getDepartments();

  app.innerHTML = `
    ${renderPacingCard()}
    ${renderBreadcrumb()}
    <section>
      <p class="eyebrow">TX Scorecard <span class="real">REAL DATA</span></p>
      <h1>BUY / LIST / SELL</h1>
      <p class="sub">Layered drill-down from TX Total to Department to Rep to Account. Each level shows three diagnostic sections: do they BUY digitally, do they LIST their catalog, do they SELL online?</p>
      <div class="band blue" style="margin-top:14px">155 wholesaler accounts | 8 implementation leads | H1 2026 data | Sources: Snowflake + Salesforce</div>
    </section>

    ${renderBuySection(t, 'total')}
    ${renderListSection(t, 'total')}
    ${renderSellSection(t, 'total')}

    <section>
      <h3>Drill Down by Implementation Lead</h3>
      <p class="small">Click any row to see that department's BUY/LIST/SELL breakdown</p>
      ${renderDrillTable(depts, 'Implementation Lead', 'drillToDept')}
    </section>
  `;
}

function renderDeptView(app) {
  const dept = getDepartments().find(d => d.name === currentView.dept);
  if (!dept) { navigateTo('total'); return; }
  const reps = getRepsByDept(currentView.dept);

  app.innerHTML = `
    ${renderPacingCard()}
    ${renderBreadcrumb()}
    <section>
      <p class="eyebrow">Department</p>
      <h2>${dept.name}</h2>
      <p class="sub">${dept.accounts.length} accounts | ${fmtK(dept.ft)} fees H1 | ${fmtK(dept.gon)} online GMV</p>
    </section>

    ${renderBuySection(dept, 'dept')}
    ${renderListSection(dept, 'dept')}
    ${renderSellSection(dept, 'dept')}

    <section>
      <h3>CS Reps in ${dept.name}'s Portfolio</h3>
      ${renderDrillTable(reps, 'CS Rep', 'drillToRep')}
    </section>

    <section>
      <h3>All Accounts</h3>
      <p class="small">Click any row to see account detail</p>
      ${renderDrillTable(dept.accounts.map(a => ({...a, name:a.n, accounts:[a]})).sort((a,b) => b.ft - a.ft), 'Account', 'drillToAccount')}
    </section>
  `;
}

function renderRepView(app) {
  const dept = getDepartments().find(d => d.name === currentView.dept);
  if (!dept) { navigateTo('total'); return; }
  const rep = getRepsByDept(currentView.dept).find(r => r.name === currentView.rep);
  if (!rep) { navigateTo('dept', currentView.dept); return; }

  app.innerHTML = `
    ${renderPacingCard()}
    ${renderBreadcrumb()}
    <section>
      <p class="eyebrow">CS Rep</p>
      <h2>${rep.name}</h2>
      <p class="sub">${rep.accounts.length} accounts under ${currentView.dept} | ${fmtK(rep.ft)} fees H1 | ${fmtK(rep.gon)} online GMV</p>
    </section>

    ${renderBuySection(rep, 'rep')}
    ${renderListSection(rep, 'rep')}
    ${renderSellSection(rep, 'rep')}

    <section>
      <h3>Accounts</h3>
      ${renderDrillTable(rep.accounts.map(a => ({...a, name:a.n, accounts:[a]})).sort((a,b) => b.ft - a.ft), 'Account', 'drillToAccount')}
    </section>
  `;
}

function renderAccountView(app) {
  const acct = ACCOUNTS.find(a => a.n === currentView.account);
  if (!acct) { navigateTo('total'); return; }

  const b = buyStatus(acct);
  const s = sellStatus(acct);
  const procDigital = acct.pt > 0 ? (acct.pt - acct.po) / acct.pt * 100 : 0;
  const sellOnline = acct.gt > 0 ? acct.gon / acct.gt * 100 : 0;

  // Diagnostic questions
  let buyDiag = '', listDiag = '', sellDiag = '';
  if (acct.pt === 0) buyDiag = 'This account has ZERO procurement activity in H1 2026. Are they buying outside the platform entirely?';
  else if (procDigital < 5) buyDiag = `Only ${fmtPct(procDigital)} digital procurement. ${fmtK(acct.po)} is manual. What blocks them from using K2K/Web/API to buy?`;
  else if (procDigital < 30) buyDiag = `${fmtPct(procDigital)} digital. Growing but still ${fmtPct(100-procDigital)} manual. Which categories are hardest to move online?`;
  else buyDiag = `${fmtPct(procDigital)} digital procurement. Good adoption. Push for remaining ${fmtPct(100-procDigital)} manual volume.`;

  if (acct.k2k === 0) listDiag = 'ZERO K2K connections. Cannot list or be discovered. Connections are the prerequisite for everything.';
  else if (acct.k2k < 10) listDiag = `Only ${acct.k2k} connections. Limited reach. Are they connected to the right farms for their product mix?`;
  else if (acct.av === 0) listDiag = `${acct.k2k} connections but ZERO availability listed. Connected but not publishing. What blocks them from sharing availability?`;
  else listDiag = `${acct.k2k} connections, ${acct.av} availability entries. Check format match and category coverage.`;

  if (acct.gon === 0 && acct.goff === 0) sellDiag = 'ZERO GMV. No online or offline sales recorded. Is this account pre-go-live or churned?';
  else if (acct.gon === 0) sellDiag = `${fmtK(acct.goff)} offline GMV but $0 online. This is a 100% manual seller. What would it take to get first online order?`;
  else if (sellOnline < 5) sellDiag = `Only ${fmtPct(sellOnline)} online (${fmtK(acct.gon)}). Token digital. ${fmtK(acct.goff)} offline is the real volume. Push online habit.`;
  else if (sellOnline < 30) sellDiag = `${fmtPct(sellOnline)} online. Growing digital channel. ${fmtK(acct.gon)} online, ${fmtK(acct.goff)} offline.`;
  else sellDiag = `${fmtPct(sellOnline)} online. Strong digital seller. ${fmtK(acct.gon)} online, fees = ${fmtK(acct.ft)}.`;

  app.innerHTML = `
    ${renderPacingCard()}
    ${renderBreadcrumb()}
    <section>
      <p class="eyebrow">Account Detail</p>
      <h2>${acct.n}</h2>
      <div class="grid3" style="margin:14px 0">
        <div><span class="small">Implementation</span><br><strong>${acct.impl}</strong></div>
        <div><span class="small">CS Rep</span><br><strong>${acct.cs || '—'}</strong></div>
        <div><span class="small">Lifecycle</span><br><strong>${acct.lc || '—'}</strong></div>
      </div>
      <div class="grid3" style="margin:14px 0">
        <div><span class="small">Systems</span><br><strong>${acct.sys || '—'}</strong></div>
        <div><span class="small">Go-Live</span><br><strong>${acct.gl || '—'}</strong></div>
        <div><span class="small">Channels</span><br><strong>${acct.ch || 0} active</strong></div>
      </div>
    </section>

    <div class="bls-section buy open">
      <div class="bls-header" onclick="this.parentElement.classList.toggle('open')">
        <div>
          <h3><span style="color:var(--blue)">BUY</span> -- ${acct.n}</h3>
          <div class="bls-summary">${fmtK(acct.pt - acct.po)} online / ${fmtK(acct.po)} manual | ${fmtPct(procDigital)} digital</div>
        </div>
        <span class="bls-arrow">&#9654;</span>
      </div>
      <div class="bls-body">
        <div class="diagnostic"><strong>Diagnostic:</strong> ${buyDiag}</div>
        <div class="kpi-row">
          <div class="kpi-box"><div class="kpi-label">Total Procurement</div><div class="kpi-val">${fmtK(acct.pt)}</div></div>
          <div class="kpi-box"><div class="kpi-label">K2K Procurement</div><div class="kpi-val">${fmtK(acct.pk)}</div></div>
          <div class="kpi-box"><div class="kpi-label">Offline Procurement</div><div class="kpi-val">${fmtK(acct.po)}</div></div>
          <div class="kpi-box"><div class="kpi-label">% Digital</div><div class="kpi-val">${fmtPct(procDigital)}</div></div>
        </div>
        ${acct.pt > 0 ? `<div class="mini-bar" style="height:12px;margin:10px 0">
          <div class="fill blue" style="width:${procDigital}%"></div>
        </div>
        <p class="small">${fmtPct(procDigital)} digital (blue) vs ${fmtPct(100-procDigital)} manual</p>` : ''}
      </div>
    </div>

    <div class="bls-section list open">
      <div class="bls-header" onclick="this.parentElement.classList.toggle('open')">
        <div>
          <h3><span style="color:var(--green)">LIST</span> -- ${acct.n}</h3>
          <div class="bls-summary">${acct.k2k} K2K connections | ${acct.av} avail vendors | ${fmtNum(acct.as)} avail SKUs</div>
        </div>
        <span class="bls-arrow">&#9654;</span>
      </div>
      <div class="bls-body">
        <div class="diagnostic"><strong>Diagnostic:</strong> ${listDiag}</div>
        <div class="kpi-row">
          <div class="kpi-box"><div class="kpi-label">K2K Connections</div><div class="kpi-val" style="color:var(--green)">${acct.k2k}</div></div>
          <div class="kpi-box"><div class="kpi-label">Availability Vendors</div><div class="kpi-val">${acct.av}</div></div>
          <div class="kpi-box"><div class="kpi-label">Availability SKUs</div><div class="kpi-val">${fmtNum(acct.as)}</div></div>
          <div class="kpi-box"><div class="kpi-label">Active Channels</div><div class="kpi-val">${acct.ch}</div></div>
        </div>
      </div>
    </div>

    <div class="bls-section sell open">
      <div class="bls-header" onclick="this.parentElement.classList.toggle('open')">
        <div>
          <h3><span style="color:var(--purple)">SELL</span> -- ${acct.n}</h3>
          <div class="bls-summary">${fmtK(acct.gon)} online | ${fmtPct(sellOnline)} online | ${fmtK(acct.ft)} fees</div>
        </div>
        <span class="bls-arrow">&#9654;</span>
      </div>
      <div class="bls-body">
        <div class="diagnostic"><strong>Diagnostic:</strong> ${sellDiag}</div>
        <div class="kpi-row">
          <div class="kpi-box"><div class="kpi-label">Online GMV</div><div class="kpi-val" style="color:var(--purple)">${fmtK(acct.gon)}</div><div class="kpi-sub">${fmtPct(sellOnline)} of total</div></div>
          <div class="kpi-box"><div class="kpi-label">K2K GMV</div><div class="kpi-val">${fmtK(acct.gk)}</div></div>
          <div class="kpi-box"><div class="kpi-label">Offline GMV</div><div class="kpi-val">${fmtK(acct.goff)}</div></div>
          <div class="kpi-box"><div class="kpi-label">Total GMV</div><div class="kpi-val">${fmtK(acct.gt)}</div></div>
        </div>
        ${acct.gt > 0 ? `<div class="mini-bar" style="height:12px;margin:10px 0">
          <div class="fill purple" style="width:${sellOnline}%"></div>
        </div>
        <p class="small">${fmtPct(sellOnline)} online (purple) vs ${fmtPct(100-sellOnline)} offline</p>` : ''}
        <div class="kpi-row" style="margin-top:16px">
          <div class="kpi-box"><div class="kpi-label">Fees Total</div><div class="kpi-val" style="color:var(--green)">${fmtK(acct.ft)}</div></div>
          <div class="kpi-box"><div class="kpi-label">Fees eCom</div><div class="kpi-val">${fmtK(acct.fe)}</div></div>
          <div class="kpi-box"><div class="kpi-label">Fees K2K</div><div class="kpi-val">${fmtK(acct.fk)}</div></div>
          <div class="kpi-box"><div class="kpi-label">Fees API</div><div class="kpi-val">${fmtK(acct.fa)}</div></div>
        </div>
      </div>
    </div>
  `;
}

// ============================================
// INIT
// ============================================
render();
</script>
</body>
</html>
