<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TX Operating Dashboard v3</title>
  <style>
    :root{--bg:#f6f8fb;--panel:#fff;--ink:#101828;--muted:#667085;--line:#d9e0ea;--blue:#2457c5;--green:#12805c;--gold:#b26a00;--red:#b42318;--purple:#6941c6;--cyan:#067a91;--shadow:0 14px 34px rgba(16,24,40,.07)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.45}
    main{width:min(1480px,calc(100% - 40px));margin:0 auto;padding:28px 0 70px}
    a{color:var(--blue);font-weight:850;text-decoration:none;cursor:pointer}a:hover{text-decoration:underline}
    section{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:22px;margin-bottom:14px}
    .eyebrow{margin:0 0 8px;color:var(--cyan);font-size:12px;font-weight:950;letter-spacing:.08em;text-transform:uppercase}
    h1,h2,h3,p{margin-top:0}h1{font-size:clamp(28px,4vw,42px);line-height:1.05;margin-bottom:12px}h2{font-size:clamp(20px,2.5vw,28px);line-height:1.1;margin-bottom:8px}h3{font-size:18px;margin-bottom:8px}
    .sub{color:var(--muted);font-size:15px;max-width:1040px}.small{color:var(--muted);font-size:13px}
    .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    .grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
    .grid6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
    .card{border:1px solid var(--line);border-radius:9px;background:#fff;padding:15px}.card strong{display:block;margin-bottom:5px;font-size:20px;line-height:1.1}.card p{margin:0;color:var(--muted);font-size:12px}.card small{display:block;margin-bottom:6px;color:var(--muted);font-size:11px;font-weight:950;letter-spacing:.06em;text-transform:uppercase}
    .blueLine{border-left:5px solid var(--blue)}.okLine{border-left:5px solid var(--green)}.warnLine{border-left:5px solid var(--gold)}.danger{border-left:5px solid var(--red)}.cyanLine{border-left:5px solid var(--cyan)}.purpleLine{border-left:5px solid var(--purple)}
    .tableWrap{overflow-x:auto;border:1px solid var(--line);border-radius:9px;background:#fff}
    table{width:100%;border-collapse:collapse}
    th,td{border-bottom:1px solid #edf1f6;padding:10px 12px;text-align:left;vertical-align:top;font-size:13px}
    th{background:#f3f6fb;color:#344054;font-size:11px;font-weight:950;letter-spacing:.06em;text-transform:uppercase;position:sticky;top:0;z-index:2;cursor:pointer;user-select:none;white-space:nowrap}
    th:hover{background:#e8edf5}th .sort-arrow{margin-left:4px;font-size:9px;color:var(--muted)}
    tr:last-child td{border-bottom:none}
    tr.clickable{cursor:pointer}tr.clickable:hover td{background:#f8fafc}
    .tag{display:inline-flex;align-items:center;min-height:22px;border-radius:999px;padding:0 9px;border:1px solid var(--line);background:#f8fafc;color:#344054;font-size:11px;font-weight:900;white-space:nowrap}
    .tag.ok{background:#ecfdf3;color:#067647;border-color:#abefc6}.tag.warn{background:#fffaeb;color:#b54708;border-color:#fedf89}.tag.bad{background:#fef3f2;color:#b42318;border-color:#fecdca}.tag.wait{background:#eef4ff;color:#3538cd;border-color:#c7d7fe}.tag.neutral{background:#f8fafc;color:#344054;border-color:var(--line)}
    /* Confidence badges */
    .conf{font-size:9px;font-weight:900;padding:1px 5px;border-radius:3px;vertical-align:middle;margin-left:4px;letter-spacing:.03em;display:inline-block}
    .conf.high{background:#ecfdf3;color:#067647}
    .conf.med{background:#fffaeb;color:#b54708}
    .conf.low{background:#fef3f2;color:#b42318}
    .conf.gap{background:#1a1d26;color:#8b8fa3;border:1px solid #3d4255}
    /* Breadcrumb */
    .breadcrumb{display:flex;align-items:center;gap:6px;padding:12px 18px;background:#fff;border:1px solid var(--line);border-radius:9px;margin-bottom:14px;font-size:14px;font-weight:700;box-shadow:var(--shadow)}
    .breadcrumb span{color:var(--muted);font-weight:400}
    .breadcrumb a{font-weight:800}
    /* Funnel bar */
    .funnel-wrap{margin:10px 0}
    .funnel-label{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
    .funnel-bar{display:flex;height:32px;border-radius:6px;overflow:hidden;border:1px solid var(--line);cursor:pointer}
    .funnel-seg{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;min-width:2px;transition:opacity .15s;position:relative}
    .funnel-seg:hover{opacity:.85}
    .funnel-seg .tip{display:none;position:absolute;top:-32px;left:50%;transform:translateX(-50%);background:#101828;color:#fff;padding:4px 8px;border-radius:5px;font-size:11px;white-space:nowrap;z-index:10}
    .funnel-seg:hover .tip{display:block}
    .funnel-legend{display:flex;gap:14px;margin-top:6px;flex-wrap:wrap}
    .funnel-legend-item{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:#344054}
    .funnel-dot{width:10px;height:10px;border-radius:3px}
    /* Detail panels */
    .detail-panels{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .detail-panel{border:1px solid var(--line);border-radius:9px;padding:18px;background:#fff}
    .detail-panel h3{font-size:16px;margin-bottom:12px}
    .metric-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f3f6fb;font-size:13px}
    .metric-row:last-child{border-bottom:none}
    .metric-label{color:var(--muted);font-weight:600}
    .metric-value{font-weight:800}
    .diagnostic{margin-top:14px;padding:12px 16px;border-radius:8px;font-size:13px;font-weight:600}
    .diagnostic em{font-style:normal;font-weight:400;display:block;margin-top:4px;font-size:12px}
    .diag-dormant{background:#fffbf0;border:1px solid #fedf89;color:#7c3e00}
    .diag-dormant em{color:#b54708}
    .diag-active{background:#ecfdf3;border:1px solid #abefc6;color:#067647}
    .diag-active em{color:#12805c}
    .diag-churned{background:#fef3f2;border:1px solid #fecdca;color:#b42318}
    .diag-churned em{color:#912018}
    .diag-noconn{background:#f8fafc;border:1px solid var(--line);color:#344054}
    .diag-noconn em{color:var(--muted)}
    .diag-activated{background:#eef4ff;border:1px solid #c7d7fe;color:#3538cd}
    .diag-activated em{color:#3538cd}
    .diag-offline{background:#fffbf0;border:1px solid #fedf89;color:#7c3e00}
    .diag-offline em{color:#b54708}
    .diag-low{background:#fffaeb;border:1px solid #fedf89;color:#b54708}
    .diag-low em{color:#b54708}
    .diag-growing{background:#eef4ff;border:1px solid #c7d7fe;color:#3538cd}
    .diag-growing em{color:#3538cd}
    .diag-healthy{background:#ecfdf3;border:1px solid #abefc6;color:#067647}
    .diag-healthy em{color:#12805c}
    .diag-nosupply{background:#fef3f2;border:1px solid #fecdca;color:#b42318}
    .diag-nosupply em{color:#912018}
    .header-card{padding:18px;border:1px solid var(--line);border-radius:9px;background:#fff;margin-bottom:14px;box-shadow:var(--shadow)}
    .header-card h2{margin-bottom:4px}
    .header-meta{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
    .header-meta strong{color:var(--ink)}
    .activity-log{margin-top:14px;border:1px solid var(--line);border-radius:9px;padding:14px;background:#fff;box-shadow:var(--shadow)}
    .activity-log h3{font-size:14px;margin-bottom:8px}
    .log-item{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f3f6fb;font-size:12px;color:#344054}
    .log-item:last-child{border-bottom:none}
    .mini-funnel{display:flex;align-items:center;gap:4px;margin:12px 0;font-size:12px;font-weight:700;flex-wrap:wrap}
    .mini-funnel-step{padding:6px 12px;border-radius:6px;text-align:center;min-width:60px}
    .mini-funnel-arrow{color:var(--muted);font-weight:400}
    .feature-flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
    .ff{display:inline-flex;align-items:center;height:22px;border-radius:5px;padding:0 8px;font-size:11px;font-weight:800}
    .ff-on{background:#ecfdf3;color:#067647;border:1px solid #abefc6}
    .ff-off{background:#fef3f2;color:#b42318;border:1px solid #fecdca}
    .supply-block{margin-top:12px;padding:12px;background:#f8fafc;border-radius:7px;border:1px solid var(--line);font-size:12px}
    .supply-block strong{font-size:13px}
    /* Data Health section */
    .dh-section{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:22px;margin-top:20px}
    .dh-section h2{margin-bottom:16px}
    .dh-group{margin-bottom:18px}
    .dh-group h3{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
    .dh-table{width:100%;border-collapse:collapse;font-size:13px}
    .dh-table th,.dh-table td{padding:8px 12px;border-bottom:1px solid #edf1f6;text-align:left}
    .dh-table th{background:#f3f6fb;font-size:11px;font-weight:950;letter-spacing:.06em;text-transform:uppercase;color:#344054}
    .dh-table tr:last-child td{border-bottom:none}
    .dh-table td:first-child{font-weight:700}
    .dh-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
    .dh-dot.green{background:#22c55e}.dh-dot.yellow{background:#f59e0b}.dh-dot.black{background:#1a1d26}
    /* Tooltip on hover */
    .ttip{position:relative;cursor:help;border-bottom:1px dashed var(--muted)}
    .ttip:hover::after{content:attr(data-tip);position:absolute;bottom:120%;left:50%;transform:translateX(-50%);background:#101828;color:#fff;padding:6px 10px;border-radius:5px;font-size:11px;z-index:20;font-weight:400;max-width:320px;white-space:normal;width:max-content}
    /* Panel C mini table */
    .panel-c{margin-top:14px;border:1px solid var(--line);border-radius:9px;padding:14px;background:#fff;box-shadow:var(--shadow)}
    .panel-c h3{font-size:14px;margin-bottom:10px}
    .panel-c table{width:100%;border-collapse:collapse;font-size:12px}
    .panel-c th,.panel-c td{padding:6px 10px;border-bottom:1px solid #edf1f6;text-align:left}
    .panel-c th{background:#f3f6fb;font-size:10px;font-weight:950;letter-spacing:.06em;text-transform:uppercase}
    .panel-c tr:last-child td{border-bottom:none}
    @media(max-width:980px){main{width:min(100% - 24px,1480px)}.grid2,.grid3,.grid4,.grid6,.detail-panels{grid-template-columns:1fr}}
  </style>
</head>

// ═══════════════════════════════════════════════════════════════════════
// FUNNEL LOGIC (derived from data)
// ═══════════════════════════════════════════════════════════════════════
function buyFunnel(a) {
  if (a.ch > 0 && a.av === 0 && a.as === 0) return 'Churned';
  if (a.k2k === 0) return 'No connections';
  if (a.av > 0 || a.as > 0) return 'Active';
  if (a.pk > 0) return 'Activated';
  return 'Dormant';
}

function sellFunnel(a) {
  if (a.gt === 0) return 'No supply';
  if (a.gon === 0 && (a.gk||0) === 0) return 'Offline only';
  const onlineTotal = a.gon + (a.gk || 0);
  const pctOnline = a.gt > 0 ? onlineTotal / a.gt : 0;
  if (pctOnline < 0.15) return 'Low online';
  if (pctOnline < 0.50) return 'Growing';
  return 'Healthy';
}

const BUY_COLORS = {'No connections':'#94a3b8','Dormant':'#f59e0b','Activated':'#eab308','Active':'#22c55e','Churned':'#ef4444'};
const SELL_COLORS = {'No supply':'#94a3b8','Offline only':'#f59e0b','Low online':'#eab308','Growing':'#3b82f6','Healthy':'#22c55e'};
const BUY_TAG_CLASS = {'No connections':'neutral','Dormant':'warn','Activated':'wait','Active':'ok','Churned':'bad'};
const SELL_TAG_CLASS = {'No supply':'neutral','Offline only':'warn','Low online':'wait','Growing':'wait','Healthy':'ok'};
const BUY_STAGES = ['No connections','Dormant','Activated','Active','Churned'];
const SELL_STAGES = ['No supply','Offline only','Low online','Growing','Healthy'];

// ═══════════════════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════════════════
function fmt(v) { return v >= 1e6 ? '$' + (v/1e6).toFixed(1) + 'M' : v >= 1e3 ? '$' + (v/1e3).toFixed(0) + 'K' : '$' + v; }
function pct(n,d) { return d > 0 ? (n/d*100).toFixed(1) + '%' : '0%'; }
function daysSince(d) { if (!d) return ''; const dt = new Date(d); const now = new Date('2026-07-15'); return Math.floor((now - dt) / 86400000); }
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function aggregate(list) {
  const r = {accounts:list.length, k2k:0, pt:0, pk:0, po:0, ft:0, fe:0, fk:0, fa:0, gon:0, gk:0, goff:0, gt:0, av:0, as:0, ch:0};
  const buy = {}, sell = {};
  BUY_STAGES.forEach(s => buy[s] = 0);
  SELL_STAGES.forEach(s => sell[s] = 0);
  list.forEach(a => {
    r.k2k += a.k2k; r.pt += a.pt; r.pk += a.pk; r.po += (a.po||0);
    r.ft += a.ft; r.fe += a.fe; r.fk += a.fk; r.fa += (a.fa||0);
    r.gon += a.gon; r.gk += (a.gk||0); r.goff += a.goff; r.gt += a.gt;
    r.av += a.av; r.as += a.as; r.ch += a.ch;
    buy[buyFunnel(a)]++;
    sell[sellFunnel(a)]++;
  });
  r.buy = buy; r.sell = sell;
  r.withProc = list.filter(a => a.pt > 0).length;
  r.activeL30D = list.filter(a => a.av > 0 || a.as > 0).length;
  r.dormant = buy['Dormant'] || 0;
  r.sellingOnline = list.filter(a => a.gon > 0 || a.gk > 0).length;
  r.offlineOnly = sell['Offline only'] || 0;
  r.pctOnlineBuy = r.pt > 0 ? (r.pk / r.pt * 100).toFixed(1) : '0.0';
  r.pctOnlineSell = r.gt > 0 ? ((r.gon + r.gk) / r.gt * 100).toFixed(1) : '0.0';
  return r;
}

// ═══════════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════════
let state = { level: 0, dept: null, rep: null, account: null };
let sortCol = null, sortDir = 1;

function goLevel(level, dept, rep, account) {
  state.level = level;
  if (level >= 1) state.dept = dept || state.dept;
  if (level >= 2) state.rep = rep || state.rep;
  if (level >= 3) state.account = account || state.account;
  if (level < 3) state.account = null;
  if (level < 2) state.rep = null;
  if (level < 1) state.dept = null;
  sortCol = null; sortDir = 1;
  render();
}

function renderBreadcrumb() {
  const bc = document.getElementById('breadcrumb');

  if (state.level >= 1) html += ' <span>&rsaquo;</span> <a onclick="goLevel(1,\'' + esc(state.dept) + '\')">' + esc(state.dept) + '</a>';

  if (state.level >= 3) html += ' <span>&rsaquo;</span> <span style="color:var(--ink)">' + esc(state.account) + '</span>';
  bc.innerHTML = html;
}

// ═══════════════════════════════════════════════════════════════════════
// FUNNEL BAR RENDERER
// ═══════════════════════════════════════════════════════════════════════
function renderFunnelBar(label, counts, colors, stages, total, footnote) {
  let html = '<div class="funnel-wrap"><div class="funnel-label">' + label + '</div><div class="funnel-bar">';
  stages.forEach(s => {
    const c = counts[s] || 0;
    const w = total > 0 ? (c / total * 100) : 0;
    if (w > 0) {
      html += '<div class="funnel-seg" style="width:' + w + '%;background:' + colors[s] + '">' + (w > 5 ? c : '') + '<span class="tip">' + s + ': ' + c + '</span></div>';
    }
  });
  html += '</div><div class="funnel-legend">';
  stages.forEach(s => {
    html += '<div class="funnel-legend-item"><div class="funnel-dot" style="background:' + colors[s] + '"></div>' + s + ': ' + (counts[s] || 0) + '</div>';
  });
  html += '</div>';
  if (footnote) html += '<div style="font-size:11px;color:var(--muted);margin-top:4px;font-style:italic">' + footnote + '</div>';
  html += '</div>';
  return html;
}

// ═══════════════════════════════════════════════════════════════════════
// SORTABLE TABLE HELPER
// ═══════════════════════════════════════════════════════════════════════
function thSort(col, label) {
  const arrow = sortCol === col ? (sortDir > 0 ? ' &#9650;' : ' &#9660;') : '';
  return '<th onclick="sortCol=\'' + col + '\';sortDir=' + (sortCol === col ? -sortDir : 1) + ';render()">' + label + '<span class="sort-arrow">' + arrow + '</span></th>';
}

function doSort(rows, defaultCol, defaultDir) {
  if (sortCol) {
    rows.sort((a,b) => {
      let va = a[sortCol], vb = b[sortCol];
      if (va === undefined || va === null) va = '';
      if (vb === undefined || vb === null) vb = '';
      if (typeof va === 'string') return sortDir * va.localeCompare(vb);
      return sortDir * ((va||0) - (vb||0));
    });
  } else if (defaultCol) {
    rows.sort((a,b) => (defaultDir||1) * ((a[defaultCol]||0) - (b[defaultCol]||0)));
  }
}

// LEVEL 3: ACCOUNT DETAIL
// ═══════════════════════════════════════════════════════════════════════
function renderLevel3() {
  const a = DATA.find(x => x.n === state.account);
  if (!a) return '<section><h2>Account not found</h2></section>';

  const bs = buyFunnel(a);
  const ss = sellFunnel(a);
  const dl = a.gl ? daysSince(a.gl) : null;
  const totalConn = a.k2k;
  const activeVendors = a.av;
  const churnedVendors = a.ch;
  const dormantConn = Math.max(0, totalConn - activeVendors - churnedVendors);
  const onlineBuyPct = a.pt > 0 ? (a.pk / a.pt * 100).toFixed(1) : '0.0';
  const onlineSellPct = a.gt > 0 ? ((a.gon + (a.gk||0)) / a.gt * 100).toFixed(1) : '0.0';

  // Feature flags from sys
  const sysLower = (a.sys || '').toLowerCase();
  const hasProcurement = sysLower.includes('procurement');
  const hasEShop = sysLower.includes('esuite') || sysLower.includes('e-commerce') || sysLower.includes('ecommerce');
  const hasK2K = sysLower.includes('k2k');
  const hasFCS = sysLower.includes('fcs') || sysLower.includes('smart');

  // Channel mix for buy diagnostic
  const unknownPct = a.pt > 0 ? ((a.po||0) / a.pt * 100).toFixed(1) : '0.0';
  const isMostlyUnknown = a.pt > 0 && (a.po||0) / a.pt > 0.7;

  // ── Header card ──
  let html = '<div class="header-card">';
  html += '<h2>' + esc(a.n) + '</h2>';
  html += '<div class="header-meta">';
  html += '<span><strong>Product:</strong> ' + esc(a.sys) + '</span>';
  html += '<span><strong>Impl:</strong> ' + esc(a.impl) + '</span>';
  if (a.cs) html += '<span><strong>CS:</strong> ' + esc(a.cs) + '</span>';
  html += '<span><strong>Status:</strong> ' + (a.lc || 'N/A') + '</span>';
  if (dl !== null) html += '<span><strong>Days live:</strong> ' + dl + '</span>';
  html += '</div></div>';

  // ── Two panels ──
  html += '<div class="detail-panels">';

  // ══════════ PANEL A: Compra online? ══════════
  html += '<div class="detail-panel">';
  html += '<h3>PANEL A: Compra online? <span class="tag ' + BUY_TAG_CLASS[bs] + '">' + bs + '</span></h3>';

  // Mini funnel
  html += '<div class="mini-funnel">';
  const buySteps = [
    {label:'Connected', val: totalConn, color: totalConn > 0 ? '#3b82f6' : '#e5e7eb'},
    {label:'Activated', val: a.pk > 0 ? 1 : 0, color: a.pk > 0 ? '#eab308' : '#e5e7eb'},
    {label:'Active', val: activeVendors, color: activeVendors > 0 ? '#22c55e' : '#e5e7eb'},
    {label:'Churned', val: churnedVendors, color: churnedVendors > 0 ? '#ef4444' : '#e5e7eb'}
  ];
  buySteps.forEach((s,i) => {
    if (i > 0) html += '<span class="mini-funnel-arrow">&rarr;</span>';
    html += '<div class="mini-funnel-step" style="background:' + s.color + '20;border:2px solid ' + s.color + ';color:' + (s.val > 0 ? s.color : '#94a3b8') + '">' + s.label + ': ' + s.val + '</div>';
  });
  html += '</div>';
  html += '<div style="background:#f8fafc;padding:8px 12px;border-radius:6px;font-size:13px;font-weight:700;margin-bottom:12px">Current stage: <span class="tag ' + BUY_TAG_CLASS[bs] + '">' + bs + '</span></div>';

  // Buy channel split with confidence
  html += '<div style="margin-bottom:12px;padding:10px 14px;background:#f0f4ff;border-radius:7px;border:1px solid #c7d7fe">';
  html += '<div class="funnel-label">BUY-SIDE BY CHANNEL</div>';
  html += '<div class="metric-row"><span class="metric-label">Procurement (K2K)' + conf('high') + '</span><span class="metric-value">' + fmt(a.pk) + '</span></div>';
  html += '<div class="metric-row"><span class="metric-label">Web' + conf('high') + '</span><span class="metric-value">$0</span></div>';
  html += '<div class="metric-row"><span class="metric-label"><span class="ttip" data-tip="82.5% of buy-side is Unknown channel -- likely offline/manual but unconfirmed">Unknown' + conf('med') + '</span></span><span class="metric-value">' + fmt(a.po||0) + '</span></div>';
  html += '<div class="metric-row" style="border-top:2px solid var(--line);padding-top:8px"><span class="metric-label"><strong>Total Procurement</strong></span><span class="metric-value"><strong>' + fmt(a.pt) + '</strong></span></div>';
  html += '</div>';

  // Key metrics with confidence
  html += '<div class="metric-row"><span class="metric-label">% Online buy' + conf('med') + '</span><span class="metric-value">' + onlineBuyPct + '%</span></div>';

  html += '<div class="metric-row"><span class="metric-label">Active vendor spend L30D' + conf('high') + '</span><span class="metric-value">' + fmt(a.as) + '</span></div>';
  html += '<div class="metric-row"><span class="metric-label">Connections' + conf('high') + '</span><span class="metric-value">' + totalConn + ' total / ' + dormantConn + ' dormant / ' + churnedVendors + ' churned</span></div>';

  // Diagnostic — enhanced for channel mix
  let diagBuyClass = 'diag-noconn';
  let diagBuyText = '';
  if (bs === 'No connections') { diagBuyClass = 'diag-noconn'; diagBuyText = '<strong>Sin conexiones K2K.</strong><em>Necesita supply: conectar vendors relevantes para que pueda empezar a comprar online.</em>'; }
  else if (bs === 'Dormant') { diagBuyClass = 'diag-dormant'; diagBuyText = '<strong>Tiene ' + totalConn + ' conexiones pero $0 en procurement K2K.</strong><em>Ni lo intento? Lo intento y no encontro? Encontro pero no compro? Revisar si tiene supply relevante y si sabe usar la herramienta.</em>'; }
  else if (bs === 'Activated') { diagBuyClass = 'diag-activated'; diagBuyText = '<strong>Compro al menos una vez por K2K (' + fmt(a.pk) + ').</strong><em>Se mantiene? Esta diversificando vendors? Que categorias falta cubrir?</em>'; }
  else if (bs === 'Active') { diagBuyClass = 'diag-active'; diagBuyText = '<strong>Comprando de ' + activeVendors + ' vendors en L30D (' + fmt(a.as) + ').</strong><em>Se mantiene? Esta diversificando? Crece la spend?</em>'; }
  else if (bs === 'Churned') { diagBuyClass = 'diag-churned'; diagBuyText = '<strong>' + churnedVendors + ' vendors churneados, $0 activo.</strong><em>Se fue offline? No le gusto la experiencia? No tiene necesidad? Cuando fue la ultima compra?</em>'; }

  // Append channel-mix insight
  if (isMostlyUnknown && a.pt > 0) {
    diagBuyText += '<em style="margin-top:6px;display:block;color:#6941c6"><strong>Canal:</strong> ' + unknownPct + '% de sus compras es &ldquo;Unknown&rdquo;. Probablemente compra por ERP/telefono. Si es Core, podriamos ver mas detalle.</em>';
  }
  html += '<div class="diagnostic ' + diagBuyClass + '">' + diagBuyText + '</div>';

  html += '<p style="margin-top:12px"><a href="procurement-framework-v6.html" style="font-size:13px">&#8594; Buy Deep Dive</a></p>';
  html += '</div>';

  // ══════════ PANEL B: Vende online? ══════════
  html += '<div class="detail-panel">';
  html += '<h3>PANEL B: Vende online? <span class="tag ' + SELL_TAG_CLASS[ss] + '">' + ss + '</span></h3>';

  // Mini funnel
  html += '<div class="mini-funnel">';
  const hasOnlineGMV = (a.gon + (a.gk||0)) > 0;

    {label:'Supply', val: a.gt > 0 ? 'Yes' : 'No', color: a.gt > 0 ? '#3b82f6' : '#e5e7eb'},

  html += '<div style="background:#f8fafc;padding:8px 12px;border-radius:6px;font-size:13px;font-weight:700;margin-bottom:12px">Current stage: <span class="tag ' + SELL_TAG_CLASS[ss] + '">' + ss + '</span></div>';

  // Fees split by channel with confidence
  html += '<div style="margin-bottom:12px;padding:10px 14px;background:#f5f0ff;border-radius:7px;border:1px solid #d9d6fe">';
  html += '<div class="funnel-label">FEES BY CHANNEL (sell-side)</div>';
  html += '<div class="metric-row"><span class="metric-label">eCom Fees' + conf('high') + '</span><span class="metric-value">' + fmt(a.fe) + '</span></div>';

  html += '<div class="metric-row"><span class="metric-label">Online GMV (eCom)' + conf('high') + '</span><span class="metric-value">' + fmt(a.gon) + '</span></div>';
  html += '<div class="metric-row"><span class="metric-label">K2K GMV' + conf('high') + '</span><span class="metric-value">' + fmt(a.gk || 0) + '</span></div>';
  html += '<div class="metric-row"><span class="metric-label">Offline GMV' + conf('high') + '</span><span class="metric-value">' + fmt(a.goff) + '</span></div>';
  html += '<div class="metric-row"><span class="metric-label">% Online sell' + conf('high') + '</span><span class="metric-value">' + onlineSellPct + '%</span></div>';

  // Feature flags with confidence
  html += '<div style="margin-top:12px"><div class="funnel-label">Feature Flags (from product)' + conf('med') + '</div>';
  html += '<div style="font-size:10px;color:var(--muted);margin-bottom:4px">SFDC booleans &mdash; may be stale (3 mismatches found by Codex)</div>';
  html += '<div class="feature-flags">';
  html += '<span class="ff ' + (hasProcurement ? 'ff-on' : 'ff-off') + '">Procurement ' + (hasProcurement ? '&#10003;' : '&#10007;') + '</span>';
  html += '<span class="ff ' + (hasEShop ? 'ff-on' : 'ff-off') + '">eShop ' + (hasEShop ? '&#10003;' : '&#10007;') + '</span>';
  html += '<span class="ff ' + (hasK2K ? 'ff-on' : 'ff-off') + '">K2K ' + (hasK2K ? '&#10003;' : '&#10007;') + '</span>';
  html += '<span class="ff ' + (hasFCS ? 'ff-on' : 'ff-off') + '">FCS/Smart ' + (hasFCS ? '&#10003;' : '&#10007;') + '</span>';
  html += '</div></div>';

  // Supply to list with confidence
  html += '<div class="supply-block">';
  html += '<strong>Supply to list</strong>' + conf('low') + '<br>';
  if (a.goff > 0 && a.gon === 0 && (a.gk||0) === 0) {
    html += 'Has ' + fmt(a.goff) + ' in offline GMV but $0 online. Categories sold offline are not available online.';
  } else if (a.goff > 0 && (a.gon > 0 || (a.gk||0) > 0)) {
    html += 'Online: ' + fmt(a.gon + (a.gk||0)) + ' | Offline: ' + fmt(a.goff) + ' | Gap: ' + fmt(a.goff) + ' in offline sales could shift online.';
  } else if (a.gt === 0) {
    html += 'No GMV data available. Account may not have eShop set up.';
  } else {
    html += 'All GMV appears to be online. Good coverage.';
  }
  html += '<br><span style="color:var(--muted);font-size:11px">Catalog completeness: ' + conf('gap') + ' &mdash; no OFERTA/listing snapshot in Snowflake</span>';
  html += '<br><span style="color:var(--muted);font-size:11px">Forward availability: ' + conf('low') + ' &mdash; config only, no actual listing data</span>';
  html += '<br><span style="color:var(--muted);font-size:11px">Bunches/format: ' + conf('med') + ' &mdash; Core only, GAP for eSuite-only</span>';
  html += '</div>';

  // Sell Diagnostic
  let diagSellClass = 'diag-nosupply';
  let diagSellText = '';
  if (ss === 'No supply') { diagSellClass = 'diag-nosupply'; diagSellText = '<strong>$0 GMV total.</strong><em>No tiene eShop? Cuando se implementa? Tiene infraestructura para vender online?</em>'; }
  else if (ss === 'Offline only') { diagSellClass = 'diag-offline'; diagSellText = '<strong>Vende ' + fmt(a.goff) + ' offline pero $0 online.</strong><em>Tiene eShop? Tiene supply listada online? Feature flags activos? Que categorias podria listar?</em>'; }
  else if (ss === 'Low online') { diagSellClass = 'diag-low'; diagSellText = '<strong>Solo ' + onlineSellPct + '% online.</strong><em>Supply pobre? No tiene bunches? No tiene trafico? Que categorias faltan online?</em>'; }
  else if (ss === 'Growing') { diagSellClass = 'diag-growing'; diagSellText = '<strong>Creciendo: ' + onlineSellPct + '% online.</strong><em>Que categorias faltan? Como mejorar supply? Bunches gap?</em>'; }
  else if (ss === 'Healthy') { diagSellClass = 'diag-healthy'; diagSellText = '<strong>' + onlineSellPct + '% online -- healthy.</strong><em>Se mantiene? Revenue diversificado? TX fees tracking?</em>'; }
  html += '<div class="diagnostic ' + diagSellClass + '">' + diagSellText + '</div>';

  html += '<p style="margin-top:12px"><a href="#" style="font-size:13px;color:var(--muted)">&#8594; Sell Deep Dive (future)</a></p>';
  html += '</div>';
  html += '</div>'; // close detail-panels

  // ══════════ PANEL C: Data Health (account-level) ══════════
  html += '<div class="panel-c">';
  html += '<h3>PANEL C: Data Health &mdash; ' + esc(a.n) + '</h3>';
  html += '<table><tr><th>Data Point</th><th>Available?</th><th>Confidence</th><th>What would help</th></tr>';
  html += '<tr><td>Buy channels</td><td>Partial</td><td>' + conf('med') + '</td><td>Resolver &ldquo;Unknown&rdquo; channel classification</td></tr>';
  html += '<tr><td>Sell channels</td><td>Yes</td><td>' + conf('high') + '</td><td>&mdash;</td></tr>';
  html += '<tr><td>Catalog/listings</td><td>No</td><td>' + conf('gap') + '</td><td>OFERTA snapshot in Snowflake</td></tr>';
  html += '<tr><td>Search intent</td><td>No</td><td>' + conf('gap') + '</td><td>GA4 integration (exists, not connected)</td></tr>';
  html += '<tr><td>Forward availability</td><td>Config only</td><td>' + conf('low') + '</td><td>Actual listing data vs config</td></tr>';
  html += '<tr><td>Feature flags</td><td>SFDC</td><td>' + conf('med') + '</td><td>Sync SFDC &harr; Snowflake</td></tr>';
  html += '<tr><td>Login/sessions</td><td>No</td><td>' + conf('gap') + '</td><td>GA4 / Mixpanel</td></tr>';
  html += '<tr><td>Bunches format</td><td>Core only</td><td>' + conf('med') + '</td><td>eSuite offline data</td></tr>';
  html += '<tr><td>Go-live date</td><td>' + (a.gl ? 'Yes' : 'Missing') + '</td><td>' + (a.gl ? conf('high') : conf('med')) + '</td><td>' + (a.gl ? '&mdash;' : 'Fill SFDC Go_Live_Date') + '</td></tr>';
  html += '</table></div>';

  // ── Activity section ──
  html += '<div class="activity-log">';
  html += '<h3>Activity &amp; Context</h3>';
  html += '<div class="log-item"><span><strong>Product:</strong> ' + esc(a.sys) + '</span></div>';
  html += '<div class="log-item"><span><strong>Implementation Consultant:</strong> ' + esc(a.impl) + '</span></div>';
  if (a.cs) html += '<div class="log-item"><span><strong>CS Advisor:</strong> ' + esc(a.cs) + '</span></div>';
  html += '<div class="log-item"><span><strong>Lifecycle Stage:</strong> ' + (a.lc || 'N/A') + '</span></div>';
  if (a.gl) html += '<div class="log-item"><span><strong>Go-live:</strong> ' + a.gl + ' (' + daysSince(a.gl) + ' days ago)</span></div>';
  html += '<div class="log-item"><span><strong>Fathom calls:</strong> Available via Fathom MCP (Jun 1+)' + conf('high') + '</span></div>';
  html += '<div class="log-item"><span><strong>SFDC Last Activity:</strong> Check SFDC' + conf('med') + '</span></div>';
  html += '<div class="log-item"><span><strong>Effort (Cupido):</strong> Check Cupido dashboard' + conf('high') + ' (for tracked pairs) ' + conf('gap') + ' (non-Cupido accounts)</span></div>';
  html += '</div>';

  return html;
}

// ═══════════════════════════════════════════════════════════════════════

// MAIN RENDER
// ═══════════════════════════════════════════════════════════════════════
function render() {
  renderBreadcrumb();
  const app = document.getElementById('app');
  switch(state.level) {
    case 0: app.innerHTML = renderLevel0(); break;
    case 1: app.innerHTML = renderLevel1(); break;
    case 2: app.innerHTML = renderLevel2(); break;
    case 3: app.innerHTML = renderLevel3(); break;
  }
  window.scrollTo(0, 0);
}

render();
</script>
