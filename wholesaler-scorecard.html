    .card{border:1px solid var(--line);border-radius:10px;background:#fff;padding:18px}.card strong{display:block;margin-bottom:6px;font-size:22px;line-height:1.1}.card p{margin:0;color:var(--muted)}.card small{display:block;margin-bottom:6px;color:var(--muted);font-size:11px;font-weight:950;letter-spacing:.06em;text-transform:uppercase}

    .tableWrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #edf1f6;padding:12px 14px;text-align:left;vertical-align:top;font-size:14px}th{background:#f3f6fb;color:#344054;font-size:11px;font-weight:950;letter-spacing:.06em;text-transform:uppercase;position:sticky;top:0;z-index:1}tr:last-child td{border-bottom:none}

    .real{display:inline-flex;align-items:center;min-height:20px;border-radius:4px;padding:0 7px;background:#ecfdf3;color:#067647;font-size:10px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;margin-left:6px}
    .source-tag{display:inline-flex;align-items:center;min-height:20px;border-radius:4px;padding:0 7px;font-size:10px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;margin-right:6px}

    .source-sfdc{background:#f4f0ff;color:#5925dc;border:1px solid #d9d6fe}

    .breadcrumb{display:flex;align-items:center;gap:8px;padding:12px 0;font-size:14px;font-weight:700;color:var(--muted);flex-wrap:wrap}
    .breadcrumb span{cursor:pointer;color:var(--blue);transition:color .1s}.breadcrumb span:hover{color:#1d4ed8;text-decoration:underline}
    .breadcrumb .bc-sep{color:var(--line);font-weight:400;cursor:default}.breadcrumb .bc-current{color:var(--ink);cursor:default}

    /* BLS sections */
    .bls-section{border-radius:12px;margin-bottom:14px;overflow:hidden;border:1px solid var(--line);background:#fff}
    .bls-section.buy{border-left:5px solid var(--blue)}.bls-section.list{border-left:5px solid var(--green)}.bls-section.sell{border-left:5px solid var(--purple)}
    .bls-header{padding:18px 24px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none;transition:background .1s}
    .bls-header:hover{background:#f8fafc}
    .bls-header h3{margin:0;font-size:18px;display:flex;align-items:center;gap:10px}
    .bls-header .bls-summary{font-size:14px;color:var(--muted);font-weight:600}
    .bls-body{display:none;padding:0 24px 24px;border-top:1px solid var(--line)}
    .bls-section.open .bls-body{display:block}
    .bls-arrow{font-size:14px;color:var(--muted);transition:transform .2s;flex-shrink:0;margin-left:12px}
    .bls-section.open .bls-arrow{transform:rotate(90deg)}

    /* Layers */
    .layer{border:1px solid var(--line);border-radius:10px;margin:14px 0;overflow:hidden}
    .layer-header{padding:12px 16px;background:#f9fafb;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:800;user-select:none}
    .layer-header:hover{background:#f3f6fb}
    .layer-body{display:none;padding:14px 16px;border-top:1px solid #edf1f6}
    .layer.open .layer-body{display:block}
    .layer-arrow{font-size:12px;color:var(--muted);transition:transform .2s}
    .layer.open .layer-arrow{transform:rotate(90deg)}

    .drill-table .dept-badge{display:inline-flex;align-items:center;min-height:22px;border-radius:6px;padding:0 8px;font-size:11px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;margin-right:6px;background:#eff6ff;color:#1d4ed8;border:1px solid #c7d7fe}

    .dot{width:8px;height:8px;border-radius:50%;display:inline-block}

    .mini-bar{display:flex;height:6px;border-radius:3px;overflow:hidden;min-width:60px;background:#e5e7eb}

    .kpi-box{border:1px solid var(--line);border-radius:8px;padding:12px 16px;background:#fff;min-width:140px;flex:1}

    .kpi-box .kpi-sub{font-size:12px;color:var(--muted);margin-top:2px}

    .diagnostic.insight{background:#eff6ff;border-color:#93c5fd;color:#1e40af}
    .diagnostic.insight strong{color:#1e3a8a}
    td.num{text-align:right;font-variant-numeric:tabular-nums}
    th.num{text-align:right}

    .tab-bar button:hover{color:var(--ink)}
    .tab-bar button.active{color:var(--blue);border-bottom-color:var(--blue)}

    .acct-count-badge{display:inline-flex;align-items:center;min-height:20px;border-radius:4px;padding:0 7px;background:#f1f5f9;color:#475569;font-size:10px;font-weight:900;letter-spacing:.04em;margin-left:8px}

    .confidence{display:inline-flex;align-items:center;min-height:20px;border-radius:4px;padding:0 7px;font-size:10px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;margin-left:6px}

    .conf-med{background:#fffaeb;color:#b54708;border:1px solid #fedf89}
    .conf-low{background:#fef3f2;color:#b42318;border:1px solid #fecdca}
    .conf-gap{background:#f1f5f9;color:#475569;border:1px solid #d9e0ea}

// Derive product from sys field
function getProducts(sys) {
  if (!sys) return [];
  const products = [];
  if (sys.includes('Komet Core')) products.push('Komet Core');
  if (sys.includes('eSuite')) products.push('eSuite Wholesaler');
  if (sys.includes('Koronet Procurement')) products.push('Koronet Procurement');
  if (sys.includes('K2K E-Commerce')) products.push('K2K E-Commerce');
  if (sys.includes('FCS')) products.push('FCS');
  return products;
}

// Buy stage: derive from K2K connections + procurement data
function getBuyStage(acct) {
  if (acct.k2k === 0 && acct.pt === 0) return 'No Connections';
  if (acct.k2k > 0 && acct.pt === 0 && acct.pk === 0) return 'Dormant';
  if (acct.pk > 0 && acct.pk > acct.pt * 0.1) return 'Active';
  if (acct.pk > 0) return 'Activated';
  if (acct.pt > 0 && acct.pk === 0) return 'Churned';
  return 'No Connections';
}

// Sell stage: derive from GMV data
function getSellStage(acct) {
  if (acct.gon === 0 && acct.goff === 0) return 'No Sales';
  if (acct.gon === 0 && acct.goff > 0) return 'Offline Only';
  const onlinePct = acct.gt > 0 ? (acct.gon / acct.gt * 100) : 0;
  if (onlinePct < 15) return 'Low Online';
  if (onlinePct < 50) return 'Growing';
  return 'Healthy';
}

function getDepartment(acct) {
  if (acct.impl && acct.cs) return 'Both';
  if (acct.impl) return 'Implementation';
  if (acct.cs) return 'CS';
  return 'Unassigned';
}

function matchesFilters(acct) {
  // Department
  if (filterState.department !== 'All') {
    if (filterState.department === 'Implementation' && !acct.impl) return false;
    if (filterState.department === 'CS' && !acct.cs) return false;
  }
  // Rep
  if (filterState.rep !== 'All') {
    if (acct.impl !== filterState.rep && acct.cs !== filterState.rep) return false;
  }
  // Product
  if (filterState.product !== 'All') {
    if (!getProducts(acct.sys).includes(filterState.product)) return false;
  }
  // Lifecycle
  if (filterState.lifecycle !== 'All') {
    if (filterState.lifecycle === 'Past Due') {
      if (acct.lc && acct.lc !== '') return false;
    } else {
      if (acct.lc !== filterState.lifecycle) return false;
    }
  }
  // Buy Stage
  if (filterState.buyStage !== 'All') {
    if (getBuyStage(acct) !== filterState.buyStage) return false;
  }
  // Sell Stage
  if (filterState.sellStage !== 'All') {
    if (getSellStage(acct) !== filterState.sellStage) return false;
  }
  return true;
}

function getFilteredAccounts() {
  return ACCOUNTS.filter(matchesFilters);
}

function groupBy(accounts, field) {
  const groups = {};
  accounts.forEach(a => {
    const key = a[field] || '(Unassigned)';
    if (!groups[key]) groups[key] = [];
    groups[key].push(a);
  });
  return groups;
}

// ============================================
// AGGREGATION for BUY/LIST/SELL summaries
// ============================================
function aggregateBuy(accounts) {
  const totalPT = accounts.reduce((s,a) => s + a.pt, 0);
  const totalPK = accounts.reduce((s,a) => s + a.pk, 0);
  const totalPO = accounts.reduce((s,a) => s + a.po, 0);
  const totalK2K = accounts.reduce((s,a) => s + a.k2k, 0);
  const onlinePct = totalPT > 0 ? (totalPK / totalPT * 100) : 0;
  const buyingAccts = accounts.filter(a => a.pt > 0).length;
  // For leakage data, find matching accounts
  const matchedLeakage = [];
  accounts.forEach(a => {
    const l = LEAKAGE_GAP.find(r => r.company === a.n);
    if (l) matchedLeakage.push(l);
  });
  const totalLeakage = matchedLeakage.reduce((s,r) => s + r.leakage, 0);
  const totalGap = matchedLeakage.reduce((s,r) => s + r.gap, 0);
  const totalOffline = matchedLeakage.reduce((s,r) => s + r.totalOffline, 0);
  // Vendor status
  const totalAV = accounts.reduce((s,a) => s + a.av, 0);
  const totalAS = accounts.reduce((s,a) => s + a.as, 0);
  const totalCH = accounts.reduce((s,a) => s + a.ch, 0);
  return { totalPT, totalPK, totalPO, totalK2K, onlinePct, buyingAccts, totalLeakage, totalGap, totalOffline, matchedLeakage, totalAV, totalAS, totalCH };
}

function aggregateSell(accounts) {
  const totalGon = accounts.reduce((s,a) => s + a.gon, 0);
  const totalGoff = accounts.reduce((s,a) => s + a.goff, 0);
  const totalGT = accounts.reduce((s,a) => s + a.gt, 0);
  const totalGK = accounts.reduce((s,a) => s + a.gk, 0);
  const totalFT = accounts.reduce((s,a) => s + a.ft, 0);
  const totalFE = accounts.reduce((s,a) => s + a.fe, 0);
  const totalFK = accounts.reduce((s,a) => s + a.fk, 0);
  const totalFA = accounts.reduce((s,a) => s + a.fa, 0);
  const onlinePct = totalGT > 0 ? (totalGon / totalGT * 100) : 0;
  // Buyer data
  const matchedBuyers = [];
  accounts.forEach(a => {
    const b = BUYER_COHORTS.find(r => r.company === a.n);
    if (b) matchedBuyers.push(b);
  });
  const totalBuyers = matchedBuyers.reduce((s,r) => s + r.totalBuyers, 0);
  const totalRepeat3 = matchedBuyers.reduce((s,r) => s + r.repeat3plus, 0);
  const totalRepeat2 = matchedBuyers.reduce((s,r) => s + r.repeat2, 0);
  const totalNew = matchedBuyers.reduce((s,r) => s + r.newRecent, 0);
  const totalOneTime = matchedBuyers.reduce((s,r) => s + r.oneTimeOld, 0);
  return { totalGon, totalGoff, totalGT, totalGK, totalFT, totalFE, totalFK, totalFA, onlinePct, matchedBuyers, totalBuyers, totalRepeat3, totalRepeat2, totalNew, totalOneTime };
}

function aggregateList(accounts) {
  const matchedInv = [];
  const matchedCov = [];
  accounts.forEach(a => {
    const inv = INVENTORY_BUNCHES.find(r => r.company === a.n);
    if (inv) matchedInv.push(inv);
    const cov = INVENTORY_VS_ONLINE.find(r => r.company === a.n);
    if (cov) matchedCov.push(cov);
  });
  const totalProducts = matchedInv.reduce((s,r) => s + r.products, 0);
  const totalUnits = matchedInv.reduce((s,r) => s + r.units, 0);
  const companiesWithInv = matchedInv.length;
  const companiesSelling = matchedCov.filter(r => r.onProds > 0).length;
  const covsActive = matchedCov.filter(r => r.coveragePct > 0);
  const avgCoverage = covsActive.length > 0 ? covsActive.reduce((s,r) => s + r.coveragePct, 0) / covsActive.length : 0;
  return { matchedInv, matchedCov, totalProducts, totalUnits, companiesWithInv, companiesSelling, avgCoverage };
}

// RENDER: ACCOUNT DETAIL (Level 3)

function renderAccountDetail(acct) {
  const buyStage = getBuyStage(acct);
  const sellStage = getSellStage(acct);
  const buySignal = buyStage === 'Active' ? 'ok' : buyStage === 'Activated' ? 'warn' : buyStage === 'Dormant' ? 'warn' : 'bad';
  const sellSignal = sellStage === 'Healthy' ? 'ok' : sellStage === 'Growing' ? 'ok' : sellStage === 'Low Online' ? 'warn' : 'bad';
  const statusDot = acct.lc === 'Adoption' ? 'green' : acct.lc === 'Onboarding' ? 'yellow' : 'gray';
  const digitalPct = acct.pt > 0 ? (acct.pk / acct.pt * 100) : 0;
  const onlinePct = acct.gt > 0 ? (acct.gon / acct.gt * 100) : 0;

  // Find enrichment data
  const leakData = LEAKAGE_GAP.find(r => r.company === acct.n);
  const invData = INVENTORY_BUNCHES.find(r => r.company === acct.n);
  const covData = INVENTORY_VS_ONLINE.find(r => r.company === acct.n);
  const buyerData = BUYER_COHORTS.find(r => r.company === acct.n);

  // BUY diagnostic
  let buyDiag = '';
  if (acct.pt === 0 && acct.k2k === 0) buyDiag = 'No connections and no procurement. Is this account buying offline outside the platform entirely?';
  else if (acct.pt > 0 && acct.pk === 0) buyDiag = 'Procures but ZERO through K2K. All purchasing is manual/offline. Why? Friction? Training? Vendor availability?';
  else if (digitalPct < 10) buyDiag = `Only ${fmtPct(digitalPct)} of procurement is digital. What blocks migration to online purchasing?`;
  else if (digitalPct > 50) buyDiag = `Strong digital adoption at ${fmtPct(digitalPct)}. Role model for BUY behavior.`;
  else buyDiag = `${fmtPct(digitalPct)} digital procurement. Room to grow -- what are the top offline vendors?`;

  // SELL diagnostic
  let sellDiag = '';
  if (acct.gon === 0 && acct.goff === 0) sellDiag = 'No sales at all. Is this account live? Check go-live date and lifecycle stage.';
  else if (acct.gon === 0) sellDiag = 'Sells offline but ZERO online. eShop not set up? No product listed? No buyer traffic?';
  else if (onlinePct < 15) sellDiag = `Only ${fmtPct(onlinePct)} online. What categories sell online vs offline? Is the eShop visible to buyers?`;
  else if (onlinePct > 50) sellDiag = `${fmtPct(onlinePct)} online -- healthy. Focus on growing absolute GMV and buyer base.`;
  else sellDiag = `${fmtPct(onlinePct)} online GMV. Growing but opportunity remains in offline categories.`;

  return `<section>
    <div class="back-link" onclick="drillPath.pop();selectedAccount=null;render()">&larr; Back to list</div>
    <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
      <h2 style="margin-bottom:0">${acct.n}</h2>
      <span class="acct-status"><span class="dot ${statusDot}"></span> ${acct.lc || 'N/A'}</span>
      <span class="tag ${buySignal}">${buyStage}</span>
      <span class="tag ${sellSignal}">${sellStage}</span>
    </div>
    <p class="small" style="margin-top:6px">
      <strong>Impl:</strong> ${acct.impl || 'Unassigned'} | <strong>CS:</strong> ${acct.cs || 'Unassigned'} | <strong>Products:</strong> ${acct.sys} | <strong>Go-live:</strong> ${acct.gl || 'N/A'}
    </p>
    <div class="section-period" style="margin-top:12px">ACCOUNT DETAIL <span class="period-badge">H1 2026 (Jan 1 - Jun 30)</span></div>

    <div class="panel-grid">
      <!-- BUY PANEL -->
      <div class="detail-panel buy-panel">
        <h4><span style="color:var(--blue)">BUY</span></h4>
        <div class="detail-row"><span class="detail-label">K2K Connections</span><span class="detail-val">${fmtNum(acct.k2k)}</span></div>
        <div class="detail-row"><span class="detail-label">Procurement Total</span><span class="detail-val">${fmtK(acct.pt)}</span></div>
        <div class="detail-row"><span class="detail-label">Procurement K2K</span><span class="detail-val" style="color:var(--blue)">${fmtK(acct.pk)}</span></div>
        <div class="detail-row"><span class="detail-label">Procurement Offline</span><span class="detail-val">${fmtK(acct.po)}</span></div>
        <div class="detail-row"><span class="detail-label">Digital %</span><span class="detail-val">${fmtPct(digitalPct)}</span></div>
        ${leakData ? `<div class="detail-row"><span class="detail-label">LEAKAGE</span><span class="detail-val" style="color:var(--red)">${fmtK(leakData.leakage)}</span></div>
        <div class="detail-row"><span class="detail-label">GAP</span><span class="detail-val" style="color:var(--gold)">${fmtK(leakData.gap)}</span></div>
        <div class="detail-row"><span class="detail-label">Leak Vendors</span><span class="detail-val">${leakData.leakVendors}</span></div>
        <div class="detail-row"><span class="detail-label">Gap Vendors</span><span class="detail-val">${leakData.gapVendors}</span></div>` : ''}
        <div class="detail-row"><span class="detail-label">Vendors Activated</span><span class="detail-val">${fmtNum(acct.av)}</span></div>
        <div class="detail-row"><span class="detail-label">Vendors Churned</span><span class="detail-val" style="color:var(--red)">${fmtNum(acct.ch)}</span></div>
        <div class="diagnostic" style="margin-top:10px"><strong>Diagnostic:</strong> ${buyDiag}</div>
      </div>

      <!-- LIST PANEL -->
      <div class="detail-panel list-panel">
        <h4><span style="color:var(--green)">LIST</span></h4>
        ${invData ? `<div class="detail-row"><span class="detail-label">Products in Inventory</span><span class="detail-val">${fmtNum(invData.products)}</span></div>
        <div class="detail-row"><span class="detail-label">Bunches (Units)</span><span class="detail-val">${fmtNum(invData.units)}</span></div>
        <div class="detail-row"><span class="detail-label">Stems</span><span class="detail-val">${fmtNum(invData.stems)}</span></div>
        <div class="detail-row"><span class="detail-label">Categories</span><span class="detail-val">${invData.categories}</span></div>` : `<div class="detail-row"><span class="detail-label">Inventory Data</span><span class="detail-val" style="color:var(--red)">Not in top 20</span></div>`}
        ${covData ? `<div class="detail-row"><span class="detail-label">Online Products</span><span class="detail-val">${fmtNum(covData.onProds)}</span></div>
        <div class="detail-row"><span class="detail-label">Online GMV</span><span class="detail-val" style="color:var(--green)">${fmtK(covData.onTotalGmv)}</span></div>
        <div class="detail-row"><span class="detail-label">Coverage %</span><span class="detail-val" style="color:${covData.coveragePct > 50 ? 'var(--green)' : covData.coveragePct > 0 ? 'var(--gold)' : 'var(--red)'}">${fmtPct(covData.coveragePct)}</span></div>` : ''}
        <div class="diagnostic" style="margin-top:10px"><strong>Diagnostic:</strong> ${invData && covData ? (covData.coveragePct === 0 ? 'Has inventory but ZERO online sales. eShop OFF or not listing products?' : covData.coveragePct < 30 ? `Only ${fmtPct(covData.coveragePct)} coverage. Most inventory is invisible to online buyers.` : `${fmtPct(covData.coveragePct)} coverage -- good listing behavior.`) : 'No inventory data available for this account in top 20.'}</div>
      </div>

      <!-- SELL PANEL -->
      <div class="detail-panel sell-panel">
        <h4><span style="color:var(--purple)">SELL</span></h4>
        <div class="detail-row"><span class="detail-label">GMV Total</span><span class="detail-val">${fmtK(acct.gt)}</span></div>
        <div class="detail-row"><span class="detail-label">GMV Online</span><span class="detail-val" style="color:var(--purple)">${fmtK(acct.gon)}</span></div>
        <div class="detail-row"><span class="detail-label">GMV Offline</span><span class="detail-val">${fmtK(acct.goff)}</span></div>
        <div class="detail-row"><span class="detail-label">Online %</span><span class="detail-val">${fmtPct(onlinePct)}</span></div>
        <div class="detail-row"><span class="detail-label">Fees Total</span><span class="detail-val" style="color:var(--green)">${fmtK(acct.ft)}</span></div>
        <div class="detail-row"><span class="detail-label">Fees eCom</span><span class="detail-val">${fmtK(acct.fe)}</span></div>
        <div class="detail-row"><span class="detail-label">Fees K2K</span><span class="detail-val">${fmtK(acct.fk)}</span></div>
        <div class="detail-row"><span class="detail-label">Fees API</span><span class="detail-val">${fmtK(acct.fa)}</span></div>
        ${buyerData ? `<div class="detail-row"><span class="detail-label">Total Buyers</span><span class="detail-val">${fmtNum(buyerData.totalBuyers)}</span></div>
        <div class="detail-row"><span class="detail-label">Repeat 3+</span><span class="detail-val" style="color:var(--green)">${fmtNum(buyerData.repeat3plus)}</span></div>
        <div class="detail-row"><span class="detail-label">One-time Old</span><span class="detail-val" style="color:var(--red)">${fmtNum(buyerData.oneTimeOld)}</span></div>
        <div class="detail-row"><span class="detail-label">New (Jun+)</span><span class="detail-val" style="color:var(--cyan)">${fmtNum(buyerData.newRecent)}</span></div>
        <div class="detail-row"><span class="detail-label">Avg $/Buyer</span><span class="detail-val">${fmtK(buyerData.avgSpend)}</span></div>` : ''}
        <div class="diagnostic" style="margin-top:10px"><strong>Diagnostic:</strong> ${sellDiag}</div>
      </div>
    </div>

    <div class="nav-links" style="margin-top:16px">
      <span class="small" style="color:var(--muted)">Future links:</span>
      <a href="#" onclick="return false" style="color:var(--muted);cursor:not-allowed">Procurement Deep Dive (coming)</a>
      <a href="#" onclick="return false" style="color:var(--muted);cursor:not-allowed">Sell Deep Dive (coming)</a>
    </div>
  </section>`;
}

// ============================================
// RENDER: ACCOUNT TABLE ROW
// ============================================
function renderAccountRow(a, showOwner) {
  const buyStage = getBuyStage(a);
  const sellStage = getSellStage(a);
  const buySignal = buyStage === 'Active' ? 'ok' : buyStage === 'Activated' ? 'warn' : buyStage === 'Dormant' ? 'warn' : 'bad';
  const sellSignal = sellStage === 'Healthy' ? 'ok' : sellStage === 'Growing' ? 'ok' : sellStage === 'Low Online' ? 'warn' : 'bad';
  const statusDot = a.lc === 'Adoption' ? 'green' : a.lc === 'Onboarding' ? 'yellow' : 'gray';
  const onlinePct = a.gt > 0 ? (a.gon / a.gt * 100) : 0;
  const daysLive = a.gl ? Math.floor((new Date() - new Date(a.gl)) / 86400000) : null;
  const daysTag = daysLive === null ? '<span class="small">—</span>' : daysLive <= 30 ? `<span class="tag" style="background:#eff6ff;color:#1d4ed8;border-color:#c7d7fe">${daysLive}d NEW</span>` : daysLive <= 90 ? `<span class="tag warn">${daysLive}d RAMP</span>` : `<span class="small">${daysLive}d</span>`;
  return `<tr class="clickable" onclick="selectedAccount='${a.n.replace(/'/g,"\\'")}';drillPath.push({type:'account',name:'${a.n.replace(/'/g,"\\'")}'});render()">
    <td><strong style="color:var(--blue)">${a.n}</strong><br><span class="small">${a.sys}</span></td>
    <td><span class="acct-status"><span class="dot ${statusDot}"></span> ${a.lc || 'N/A'}</span></td>
    <td>${daysTag}</td>
    ${showOwner ? `<td class="small">${a.impl || '-'}<br>${a.cs || '-'}</td>` : ''}
    <td class="num">${a.k2k}</td>
    <td class="num">${fmtK(a.pt)}</td>
    <td class="num">${fmtK(a.pk)}</td>
    <td class="num">${fmtK(a.ft)}</td>
    <td class="num">${fmtK(a.gon)}</td>
    <td class="num">${fmtK(a.goff)}</td>
    <td class="num">${fmtPct(onlinePct)}</td>
    <td><span class="tag ${buySignal}">${buyStage}</span></td>
    <td><span class="tag ${sellSignal}">${sellStage}</span></td>
  </tr>`;
}

// ============================================
// RENDER: OWNER TABLE (rep drilldown)
// ============================================
function renderRepDrilldown(ownerName, accounts) {
  const totalK2K = accounts.reduce((s,a) => s + a.k2k, 0);
  const totalPT = accounts.reduce((s,a) => s + a.pt, 0);
  const totalPK = accounts.reduce((s,a) => s + a.pk, 0);
  const totalFT = accounts.reduce((s,a) => s + a.ft, 0);
  const totalGon = accounts.reduce((s,a) => s + a.gon, 0);
  const totalGoff = accounts.reduce((s,a) => s + a.goff, 0);
  const totalGT = accounts.reduce((s,a) => s + a.gt, 0);
  const onlinePct = totalGT > 0 ? (totalGon / totalGT * 100) : 0;

  return `<section>
    <div class="back-link" onclick="drillPath.pop();render()">&larr; Back to ${currentView === 'impl' ? 'Implementation' : currentView === 'cs' ? 'CS' : 'All'}</div>
    <div class="section-period">REP DETAIL <span class="period-badge">H1 2026 (Jan 1 - Jun 30)</span></div>
    <h2>${ownerName} <span class="acct-count-badge">${accounts.length} accounts</span></h2>
    <div class="kpi-row">
      <div class="kpi-box"><div class="kpi-label">K2K Connections</div><div class="kpi-val">${fmtNum(totalK2K)}</div></div>
      <div class="kpi-box"><div class="kpi-label">Procurement Total</div><div class="kpi-val">${fmtK(totalPT)}</div></div>
      <div class="kpi-box"><div class="kpi-label">Procurement K2K</div><div class="kpi-val" style="color:var(--blue)">${fmtK(totalPK)}</div></div>
      <div class="kpi-box"><div class="kpi-label">Fees Total</div><div class="kpi-val" style="color:var(--green)">${fmtK(totalFT)}</div></div>
      <div class="kpi-box"><div class="kpi-label">GMV Online</div><div class="kpi-val" style="color:var(--purple)">${fmtK(totalGon)}</div></div>
      <div class="kpi-box"><div class="kpi-label">Online %</div><div class="kpi-val">${fmtPct(onlinePct)}</div></div>
    </div>
    ${renderBuyBlock(accounts, 'rep')}
    ${renderListBlock(accounts, 'rep')}
    ${renderSellBlock(accounts, 'rep')}
    <div style="margin-top:16px">
      <h3>Accounts <span class="period-badge">H1 2026</span></h3>
      <div class="tableWrap"><table class="drill-table">
        <tr><th>Account</th><th>Status</th><th>Days Live</th><th class="num">K2K</th><th class="num">Procure Total</th><th class="num">Procure K2K</th><th class="num">Fees</th><th class="num">GMV Online</th><th class="num">GMV Offline</th><th class="num">Online %</th><th>Buy Stage</th><th>Sell Stage</th></tr>
        ${accounts.sort((a,b) => b.gt - a.gt).map(a => renderAccountRow(a, false)).join('')}
      </table></div>
    </div>
  </section>`;
}

// ============================================
// MAIN RENDER
// ============================================
function render() {
  const app = document.getElementById('app');
  const filtered = getFilteredAccounts();

  // Check if we're at account detail level
  if (selectedAccount) {
    const acct = ACCOUNTS.find(a => a.n === selectedAccount);
    if (acct) {
      app.innerHTML = `
        ${renderBreadcrumb()}
        ${renderFilterBar()}
        ${renderAccountDetail(acct)}
      `;
      return;
    }
  }

  // Check if we're at rep drilldown level
  if (drillPath.length > 0 && drillPath[drillPath.length - 1].type === 'rep') {
    const repName = drillPath[drillPath.length - 1].name;
    const field = currentView === 'cs' ? 'cs' : 'impl';
    const repAccounts = filtered.filter(a => a[field] === repName);
    app.innerHTML = `
      ${renderBreadcrumb()}
      ${renderFilterBar()}
      ${renderRepDrilldown(repName, repAccounts)}
    `;
    return;
  }

  // TOP LEVEL: TX Total view with grouped drilldown
  const groupField = currentView === 'impl' ? 'impl' : currentView === 'cs' ? 'cs' : 'impl';

  let drillHTML = '';
  if (currentView === 'all') {
    // Flat table
    drillHTML = `<div class="tableWrap"><table class="drill-table">
      <tr><th>Account</th><th>Status</th><th>Days Live</th><th>Impl / CS</th><th class="num">K2K</th><th class="num">Procure Total</th><th class="num">Procure K2K</th><th class="num">Fees</th><th class="num">GMV Online</th><th class="num">GMV Offline</th><th class="num">Online %</th><th>Buy Stage</th><th>Sell Stage</th></tr>
      ${filtered.sort((a,b) => b.gt - a.gt).map(a => renderAccountRow(a, true)).join('')}
    </table></div>`;
  } else {
    // Grouped by owner
    const groups = groupBy(filtered, groupField);
    const sortedOwners = Object.keys(groups).sort((a,b) => {
      const aGT = groups[a].reduce((s,x) => s + x.gt, 0);
      const bGT = groups[b].reduce((s,x) => s + x.gt, 0);
      return bGT - aGT;
    });

    drillHTML = sortedOwners.map(owner => {
      const accts = groups[owner];
      const totalGT = accts.reduce((s,a) => s + a.gt, 0);
      const totalFT = accts.reduce((s,a) => s + a.ft, 0);
      const totalGon = accts.reduce((s,a) => s + a.gon, 0);
      const onPct = totalGT > 0 ? (totalGon / totalGT * 100) : 0;
      return `<div class="layer"><div class="layer-header" onclick="drillPath.push({type:'rep',name:'${owner.replace(/'/g,"\\'")}'});render()">
        <span>${owner} <span class="acct-count-badge">${accts.length} accounts</span> | GMV: ${fmtK(totalGT)} (${fmtPct(onPct)} online) | Fees: ${fmtK(totalFT)}</span><span class="layer-arrow">&#9654;</span></div></div>`;
    }).join('');
  }

  app.innerHTML = `
    <!-- HEADER -->
    <section>
      <p class="eyebrow">TX Revenue OS <span class="real">REAL DATA</span></p>
      <h1>Wholesaler Scorecard<br><span style="font-size:clamp(22px,3vw,36px);color:var(--muted);font-weight:700">BUY / LIST / SELL</span></h1>
      <p class="sub">${ACCOUNTS.length} wholesalers | H1 2026 (Jan 1 - Jun 30)</p>
      <div class="nav-links">
        <a href="tx-scorecard-v3.html">TX Pacing (separate)</a>
        <a href="tx-strategy-v2/q3-hub.html">Q3 Hub</a>
      </div>
    </section>

    ${renderBreadcrumb()}
    ${renderFilterBar()}
    ${renderViewTabs()}

    <!-- BUY / LIST / SELL at TX Total level -->
    ${renderBuyBlock(filtered, 'total')}
    ${renderListBlock(filtered, 'total')}
    ${renderSellBlock(filtered, 'total')}

    <!-- Drill-down by owner -->
    <section>
      <div class="section-period">DRILL-DOWN <span class="period-badge">H1 2026 (Jan 1 - Jun 30)</span></div>
      <h2>${currentView === 'impl' ? 'By Implementation Lead' : currentView === 'cs' ? 'By CS Advisor' : 'All Accounts'}</h2>
      <p class="sub">Click a ${currentView === 'all' ? 'row' : 'rep'} to drill into their accounts and see BUY/LIST/SELL at that level.</p>
      ${drillHTML}
    </section>

    <!-- Provenance -->
    <section>
      <p class="eyebrow">Provenance</p>
      <h3>Data Sources & Confidence</h3>
      <div class="tableWrap"><table>
        <tr><th>Layer</th><th>Metric</th><th>Source</th><th>Period</th><th>Confidence</th></tr>
        <tr><td style="color:var(--blue);font-weight:800">BUY</td><td>Procurement by channel</td><td><span class="source-tag source-snow">SNOWFLAKE</span> PROCUREMENTS_SV</td><td>H1 2026 (Jan 1 - Jun 30)</td><td><span class="confidence conf-high">HIGH</span></td></tr>
        <tr><td style="color:var(--blue);font-weight:800">BUY</td><td>Leakage vs Gap</td><td><span class="source-tag source-snow">SNOWFLAKE</span> PROCUREMENTS_SV x K2K_CONNECTIONS_SV</td><td>H1 2026 (Jan 1 - Jun 30)</td><td><span class="confidence conf-high">HIGH</span></td></tr>
        <tr><td style="color:var(--blue);font-weight:800">BUY</td><td>K2K Connections</td><td><span class="source-tag source-snow">SNOWFLAKE</span> K2K_CONNECTIONS_SV</td><td>Current (all time)</td><td><span class="confidence conf-high">HIGH</span></td></tr>
        <tr><td style="color:var(--green);font-weight:800">LIST</td><td>Inventory on-hand</td><td><span class="source-tag source-snow">SNOWFLAKE</span> INVENTORY_DETAILS</td><td>H1 2026 (Jan 1 - Jun 30)</td><td><span class="confidence conf-high">HIGH</span></td></tr>
        <tr><td style="color:var(--green);font-weight:800">LIST</td><td>Bunch status (43 enabled, 15 selling)</td><td>Maga Jun 30 + Sigma dashboard</td><td>Jun 30, 2026</td><td><span class="confidence conf-med">MEDIUM</span></td></tr>
        <tr><td style="color:var(--green);font-weight:800">LIST</td><td>Feature flags (eShop, bunches, future avail)</td><td><span class="source-tag source-sfdc">SFDC</span> Account boolean fields</td><td>Current</td><td><span class="confidence conf-med">MEDIUM</span> (3 mismatches known)</td></tr>
        <tr><td style="color:var(--purple);font-weight:800">SELL</td><td>GMV sell-side</td><td><span class="source-tag source-snow">SNOWFLAKE</span> SALE_DETAILS</td><td>H1 2026 (Jan 1 - Jun 30)</td><td><span class="confidence conf-high">HIGH</span></td></tr>
        <tr><td style="color:var(--purple);font-weight:800">SELL</td><td>Fees by channel</td><td><span class="source-tag source-snow">SNOWFLAKE</span> CONSOLIDATED_TRANSACTION_FEES_SV</td><td>H1 2026 (Jan 1 - Jun 30)</td><td><span class="confidence conf-high">HIGH</span></td></tr>
        <tr><td style="color:var(--purple);font-weight:800">SELL</td><td>Buyer cohorts</td><td><span class="source-tag source-snow">SNOWFLAKE</span> SALE_DETAILS</td><td>H1 2026 (Jan 1 - Jun 30)</td><td><span class="confidence conf-high">HIGH</span></td></tr>
      </table></div>
      <p class="small" style="margin-top:12px">Rose (Data Agent L1) | Jul 15, 2026 | NOT VERIFIED by Codex | Terminology: Connected / Activated / Active / Churned / Dormant (NEVER "Mature" / "Inmature")</p>
    </section>

    <!-- Definitions -->
    <section>
      <details>
        <summary style="cursor:pointer;font-weight:800;font-size:16px;padding:8px 0">Definiciones</summary>
        <div class="tableWrap" style="margin-top:12px">
          <table>
            <tr><th style="width:180px">Término</th><th>Definición</th></tr>
            <tr><td><strong>Coverage %</strong></td><td>Categorías vendidas online / categorías vendidas offline (H1 2026). Solo Core accounts — sin Core no vemos offline.</td></tr>
            <tr><td><strong>Leakage</strong></td><td>$ comprado offline a vendors que SÍ están conectados en K2K. Problema behavioral — el vendor está, el wholesaler no lo usa.</td></tr>
            <tr><td><strong>Gap</strong></td><td>$ comprado offline a vendors que NO están en K2K. Problema de infraestructura — el vendor no está conectado.</td></tr>
            <tr><td><strong>Buy Stage</strong></td><td>No Connections (0 K2K) → Dormant (K2K pero $0 procurement) → Activated (compró ≥1 vez) → Active (compró L30D) → Churned (era activo, paró)</td></tr>
            <tr><td><strong>Sell Stage</strong></td><td>No Sales (GMV=0) → Offline Only (online=0) → Low Online (&lt;15%) → Growing (15-50%) → Healthy (&gt;50%). Nota: thresholds son proxy, mostrar % directo para decisiones.</td></tr>
            <tr><td><strong>Bunch penetration</strong></td><td>$ bunches vendidos online / $ total vendido online (H1 2026). 43 accounts con feature, 15 vendiendo, 28 dark. Fuente: Maga Jun 30.</td></tr>
            <tr><td><strong>Days Live</strong></td><td>Días desde Go-Live Date (SFDC). NEW = 0-30d, RAMP = 31-90d. Si no tiene fecha: —</td></tr>
            <tr><td><strong>Connected</strong></td><td>Tiene conexión K2K (existe en el sistema)</td></tr>
            <tr><td><strong>Activated</strong></td><td>Compró ≥1 vez via esa conexión (PROCUREMENTS_SV join, no el campo k2k_connection_status)</td></tr>
            <tr><td><strong>Active</strong></td><td>Compró en los últimos 30 días</td></tr>
            <tr><td><strong>Churned</strong></td><td>Era Active, dejó de comprar en L30D</td></tr>
            <tr><td><strong>Dormant</strong></td><td>Conectado pero nunca compró</td></tr>
          </table>
        </div>
      </details>
    </section>
  `;
}

render();
</script>
</body>
</html>
