<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ledger Candidates — TX V2</title>
  <style>
    body{margin:0;background:#f5f7fb;color:#101828;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.45}
    main{width:min(1500px,calc(100% - 40px));margin:0 auto;padding:30px 0 70px}
    a{color:#2457c5;font-weight:850;text-decoration:none}a:hover{text-decoration:underline}
    header,section{background:#fff;border:1px solid #d9e0ea;border-radius:10px;box-shadow:0 14px 34px rgba(16,24,40,.07);padding:24px;margin-bottom:16px}
    h1{font-size:clamp(36px,5vw,60px);line-height:.98;margin:0 0 12px}h2{font-size:30px;margin:0 0 8px}.sub{color:#667085;max-width:980px;font-size:17px}
    .eyebrow{margin:0 0 8px;color:#067a91;font-size:12px;font-weight:950;letter-spacing:.08em;text-transform:uppercase}
    .links{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.links a{display:inline-flex;align-items:center;min-height:38px;border:1px solid #d9e0ea;border-radius:7px;padding:0 13px;background:#fff;color:#101828}.primary{background:#2457c5!important;border-color:#2457c5!important;color:#fff!important}
    .tableWrap{overflow:auto;max-height:760px;border:1px solid #d9e0ea;border-radius:9px;background:#fff}table{width:100%;min-width:1900px;border-collapse:collapse}th,td{border-bottom:1px solid #edf1f6;padding:10px;text-align:left;vertical-align:top;font-size:13px}th{position:sticky;top:0;background:#f3f6fb;color:#344054;font-size:11px;font-weight:950;letter-spacing:.06em;text-transform:uppercase}tr:last-child td{border-bottom:none}
    input{width:min(520px,100%);min-height:42px;border:1px solid #d9e0ea;border-radius:8px;padding:0 12px;font:inherit}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:16px}.count{color:#667085;font-weight:800}
  </style>
</head>
<body>
<main>
  <header>
    <p class="eyebrow">TX Enablement V2</p>
    <h1>Ledger Candidates</h1>
    <p class="sub">GitHub feedback/call issues parsed into candidate rows. These are not active ledger rows until reviewed and promoted.</p>
    <div class="links">
      <a class="primary" href="/tx-dashboards/tx-strategy-v2/ledger.html">Back to ledger</a>
      <a href="/tx-dashboards/tx-strategy-v2/github-issue-capture.html">Issue capture</a>
      <a href="/tx-dashboards/tx-strategy-v2/promotion-readiness.html">Promotion readiness</a>
      <a href="/tx-dashboards/tx-strategy-v2/data/tx_issue_ledger_candidates.csv">Download CSV</a>
    </div>
  </header>
  <section>
    <p class="eyebrow">Candidate rows</p>
    <h2>Review before promotion</h2>
    <div class="toolbar">
      <input id="filter" type="search" placeholder="Filter candidates..." />
      <span class="count" id="count">Loading...</span>
    </div>
    <div class="tableWrap" style="margin-top:14px">
      <table id="candidateTable"></table>
    </div>
  </section>
</main>
<script>
const csvUrl = "/tx-dashboards/tx-strategy-v2/data/tx_issue_ledger_candidates.csv";
const cols = ["candidate_id","issue_number","issue_title","account","initiative","what_happened","result_or_learning","conversation_expected","expected_outcome","expected_learning","kpi_or_leading_indicator","blocker_or_objection","next_action_owner_date","need_from_facu_or_system","account_signals","value_prop_signals","trust_label","routing","promotion_state"];
function parseCsv(text){
  const rows=[]; let row=[], cell="", inQuotes=false;
  for(let i=0;i<text.length;i++){
    const c=text[i], n=text[i+1];
    if(c === '"' && inQuotes && n === '"'){ cell += '"'; i++; continue; }
    if(c === '"'){ inQuotes = !inQuotes; continue; }
    if(c === "," && !inQuotes){ row.push(cell); cell=""; continue; }
    if((c === "\n" || c === "\r") && !inQuotes){
      if(c === "\r" && n === "\n") i++;
      row.push(cell); cell="";
      if(row.some(v => v.length)) rows.push(row);
      row=[]; continue;
    }
    cell += c;
  }
  if(cell.length || row.length){ row.push(cell); rows.push(row); }
  return rows;
}
function esc(value){return String(value || "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(headers, rows){
  const indexes=cols.map(c => headers.indexOf(c)).filter(i => i >= 0);
  document.getElementById("candidateTable").innerHTML = "<thead><tr>" + indexes.map(i => `<th>${esc(headers[i])}</th>`).join("") + "</tr></thead><tbody>" +
    rows.map(row => "<tr>" + indexes.map(i => `<td>${esc(row[i])}</td>`).join("") + "</tr>").join("") + "</tbody>";
  document.getElementById("count").textContent = `${rows.length} candidates`;
}
fetch(csvUrl).then(r => r.text()).then(text => {
  const rows=parseCsv(text); const headers=rows.shift() || []; const data=rows;
  render(headers, data);
  document.getElementById("filter").addEventListener("input", e => {
    const q=e.target.value.toLowerCase().trim();
    render(headers, q ? data.filter(row => row.join(" ").toLowerCase().includes(q)) : data);
  });
}).catch(() => { document.getElementById("count").textContent = "Candidate CSV not loaded"; });
</script>
</body>
</html>
