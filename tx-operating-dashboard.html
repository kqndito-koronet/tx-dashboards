<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TX Operating Dashboard</title>
  <style>
    :root{--bg:#f6f8fb;--panel:#fff;--ink:#101828;--muted:#667085;--line:#d9e0ea;--blue:#2457c5;--green:#12805c;--gold:#b26a00;--red:#b42318;--purple:#6941c6;--cyan:#067a91;--shadow:0 14px 34px rgba(16,24,40,.07)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.45}
    main{width:min(1480px,calc(100% - 40px));margin:0 auto;padding:28px 0 70px}
    a{color:var(--blue);font-weight:850;text-decoration:none;cursor:pointer}a:hover{text-decoration:underline}
    section{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:22px;margin-bottom:14px}
    .eyebrow{margin:0 0 8px;color:var(--cyan);font-size:12px;font-weight:950;letter-spacing:.08em;text-transform:uppercase}
    h1,h2,h3,p{margin-top:0}h1{font-size:clamp(28px,4vw,42px);line-height:1.05;margin-bottom:12px}h2{font-size:clamp(20px,2.5vw,28px);line-height:1.1;margin-bottom:8px}h3{font-size:18px;margin-bottom:8px}
    .sub{color:var(--muted);font-size:15px;max-width:1040px}.small{color:var(--muted);font-size:13px}
    .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
    .card{border:1px solid var(--line);border-radius:9px;background:#fff;padding:15px}.card strong{display:block;margin-bottom:5px;font-size:22px;line-height:1.1}.card p{margin:0;color:var(--muted)}.card small{display:block;margin-bottom:6px;color:var(--muted);font-size:11px;font-weight:950;letter-spacing:.06em;text-transform:uppercase}
    .blueLine{border-left:5px solid var(--blue)}.okLine{border-left:5px solid var(--green)}.warnLine{border-left:5px solid var(--gold)}.danger{border-left:5px solid var(--red)}.cyanLine{border-left:5px solid var(--cyan)}
    .tableWrap{overflow-x:auto;border:1px solid var(--line);border-radius:9px;background:#fff}
    table{width:100%;border-collapse:collapse}
    th,td{border-bottom:1px solid #edf1f6;padding:10px 12px;text-align:left;vertical-align:top;font-size:13px}
    th{background:#f3f6fb;color:#344054;font-size:11px;font-weight:950;letter-spacing:.06em;text-transform:uppercase;position:sticky;top:0;z-index:2;cursor:pointer;user-select:none;white-space:nowrap}
    th:hover{background:#e8edf5}th .sort-arrow{margin-left:4px;font-size:9px;color:var(--muted)}
    tr:last-child td{border-bottom:none}
    tr.clickable{cursor:pointer}tr.clickable:hover td{background:#f8fafc}
    .tag{display:inline-flex;align-items:center;min-height:22px;border-radius:999px;padding:0 9px;border:1px solid var(--line);background:#f8fafc;color:#344054;font-size:11px;font-weight:900;white-space:nowrap}
    .tag.ok{background:#ecfdf3;color:#067647;border-color:#abefc6}.tag.warn{background:#fffaeb;color:#b54708;border-color:#fedf89}.tag.bad{background:#fef3f2;color:#b42318;border-color:#fecdca}.tag.wait{background:#eef4ff;color:#3538cd;border-color:#c7d7fe}.tag.neutral{background:#f8fafc;color:#344054;border-color:var(--line)}
    /* Breadcrumb */
    .breadcrumb{display:flex;align-items:center;gap:6px;padding:12px 18px;background:#fff;border:1px solid var(--line);border-radius:9px;margin-bottom:14px;font-size:14px;font-weight:700;box-shadow:var(--shadow)}
    .breadcrumb span{color:var(--muted);font-weight:400}
    .breadcrumb a{font-weight:800}
    /* Funnel bar */
    .funnel-wrap{margin:10px 0}
    .funnel-label{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
    .funnel-bar{display:flex;height:32px;border-radius:6px;overflow:hidden;border:1px solid var(--line);cursor:pointer}
    .funnel-seg{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;min-width:2px;transition:opacity .15s;position:relative}
    .funnel-seg:hover{opacity:.85}
    .funnel-seg .tip{display:none;position:absolute;top:-32px;left:50%;transform:translateX(-50%);background:#101828;color:#fff;padding:4px 8px;border-radius:5px;font-size:11px;white-space:nowrap;z-index:10}
    .funnel-seg:hover .tip{display:block}
    .funnel-legend{display:flex;gap:14px;margin-top:6px;flex-wrap:wrap}
    .funnel-legend-item{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:#344054}
    .funnel-dot{width:10px;height:10px;border-radius:3px}
    /* Detail panels */
    .detail-panels{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .detail-panel{border:1px solid var(--line);border-radius:9px;padding:18px;background:#fff}
    .detail-panel h3{font-size:16px;margin-bottom:12px}
    .metric-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f3f6fb;font-size:13px}
    .metric-row:last-child{border-bottom:none}
    .metric-label{color:var(--muted);font-weight:600}
    .metric-value{font-weight:800}
    .diagnostic{margin-top:14px;padding:12px 16px;border-radius:8px;background:#fffbf0;border:1px solid #fedf89;font-size:13px;color:#7c3e00;font-weight:600}
    .diagnostic em{font-style:normal;font-weight:400;display:block;margin-top:4px;font-size:12px;color:#b54708}
    .mock-tag{display:inline-flex;align-items:center;height:18px;border-radius:4px;padding:0 6px;background:#fff4e5;color:#b54708;font-size:9px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;margin-left:6px}
    .header-card{padding:18px;border:1px solid var(--line);border-radius:9px;background:#fff;margin-bottom:14px}
    .header-card h2{margin-bottom:4px}
    .header-meta{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
    .header-meta strong{color:var(--ink)}
    .back-btn{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:800;color:var(--blue);cursor:pointer;border:none;background:none;padding:0;margin-bottom:8px}
    .back-btn:hover{text-decoration:underline}
    .activity-log{margin-top:14px;border:1px solid var(--line);border-radius:9px;padding:14px}
    .activity-log h3{font-size:14px;margin-bottom:8px}
    .log-item{padding:6px 0;border-bottom:1px solid #f3f6fb;font-size:12px;color:#344054}
    .log-item:last-child{border-bottom:none}
    @media(max-width:980px){main{width:min(100% - 24px,1480px)}.grid2,.grid4,.detail-panels{grid-template-columns:1fr}}
  </style>
</head>

function getDept(a) {

// ═══════════════════════════════════════════════════════════════════════
// FUNNEL LOGIC (derived from data)
// ═══════════════════════════════════════════════════════════════════════
function buyFunnel(a) {
  if (a.k2k === 0) return 'No connections';
  if (a.pk === 0 && a.as === 0) {
    if (a.ch > 0) return 'Churned';
    return 'Dormant';
  }
  if (a.as > 0) return 'Active';
  if (a.pk > 0 || a.av > 0) return 'Activated';
  return 'Dormant';
}

function sellFunnel(a) {
  if (a.gt === 0) return 'No eShop';
  if (a.gon === 0) return 'No supply';
  const pct = a.gt > 0 ? (a.gon / a.gt * 100) : 0;
  if (pct < 15) return 'Low online';
  if (pct <= 50) return 'Growing';
  return 'Healthy';
}

const BUY_COLORS = {'No connections':'#94a3b8','Dormant':'#f59e0b','Activated':'#3b82f6','Active':'#22c55e','Churned':'#ef4444'};
const SELL_COLORS = {'No eShop':'#94a3b8','No supply':'#ef4444','Low online':'#f59e0b','Growing':'#3b82f6','Healthy':'#22c55e'};
const BUY_TAG_CLASS = {'No connections':'neutral','Dormant':'warn','Activated':'wait','Active':'ok','Churned':'bad'};
const SELL_TAG_CLASS = {'No eShop':'neutral','No supply':'bad','Low online':'warn','Growing':'wait','Healthy':'ok'};
const BUY_STAGES = ['No connections','Dormant','Activated','Active','Churned'];
const SELL_STAGES = ['No eShop','No supply','Low online','Growing','Healthy'];

// ═══════════════════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════════════════
function fmt(v) { return v >= 1e6 ? '$' + (v/1e6).toFixed(1) + 'M' : v >= 1e3 ? '$' + (v/1e3).toFixed(0) + 'K' : '$' + v; }
function pct(n,d) { return d > 0 ? (n/d*100).toFixed(1) + '%' : '0%'; }
function daysSince(d) { if (!d) return ''; const dt = new Date(d); const now = new Date('2026-07-15'); return Math.floor((now - dt) / 86400000); }
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function aggregate(list) {
  const r = {accounts:list.length, k2k:0, pt:0, pk:0, ft:0, gon:0, goff:0, gt:0, av:0, as:0, ch:0};
  const buy = {}, sell = {};
  BUY_STAGES.forEach(s => buy[s] = 0);
  SELL_STAGES.forEach(s => sell[s] = 0);
  list.forEach(a => {
    r.k2k += a.k2k; r.pt += a.pt; r.pk += a.pk; r.ft += a.ft;
    r.gon += a.gon; r.goff += a.goff; r.gt += a.gt;
    r.av += a.av; r.as += a.as; r.ch += a.ch;
    buy[buyFunnel(a)]++;
    sell[sellFunnel(a)]++;
  });
  r.buy = buy; r.sell = sell;
  r.activeL30D = list.filter(a => a.as > 0).length;
  r.pctOnlineBuy = r.pt > 0 ? (r.pk / r.pt * 100).toFixed(1) : '0.0';
  r.pctOnlineSell = r.gt > 0 ? (r.gon / r.gt * 100).toFixed(1) : '0.0';
  return r;
}

// ═══════════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════════
let state = { level: 0, dept: null, rep: null, account: null };
let sortCol = null, sortDir = 1;

function goLevel(level, dept, rep, account) {
  state.level = level;
  if (level >= 1) state.dept = dept || state.dept;
  if (level >= 2) state.rep = rep || state.rep;
  if (level >= 3) state.account = account || state.account;
  if (level < 3) state.account = null;
  if (level < 2) state.rep = null;
  if (level < 1) state.dept = null;
  sortCol = null; sortDir = 1;
  render();
}

// ═══════════════════════════════════════════════════════════════════════
// FUNNEL BAR RENDERER
// ═══════════════════════════════════════════════════════════════════════
function renderFunnelBar(label, counts, colors, stages, total) {
  let html = '<div class="funnel-wrap"><div class="funnel-label">' + label + '</div><div class="funnel-bar">';
  stages.forEach(s => {
    const c = counts[s] || 0;
    const w = total > 0 ? (c / total * 100) : 0;
    if (w > 0) {
      html += '<div class="funnel-seg" style="width:' + w + '%;background:' + colors[s] + '">' + (w > 6 ? c : '') + '<span class="tip">' + s + ': ' + c + '</span></div>';
    }
  });
  html += '</div><div class="funnel-legend">';
  stages.forEach(s => {
    html += '<div class="funnel-legend-item"><div class="funnel-dot" style="background:' + colors[s] + '"></div>' + s + ': ' + (counts[s] || 0) + '</div>';
  });
  html += '</div></div>';
  return html;
}

// ═══════════════════════════════════════════════════════════════════════
function sortTable(col) {
  if (sortCol === col) sortDir *= -1;
  else { sortCol = col; sortDir = 1; }
  render();
}

    html += '<td><strong>' + esc(a.n) + '</strong></td>';
    html += '<td style="font-size:12px">' + esc(a.sys) + '</td>';
    html += '<td>' + (a.daysLive !== '' ? a.daysLive + 'd' : '--') + '</td>';
    html += '<td>' + (a.lc || '--') + '</td>';
    html += '<td>' + a.k2k + '</td>';
    html += '<td>' + fmt(a.pk) + '</td>';
    html += '<td>' + (a.pt > 0 ? a.onlinePctBuy.toFixed(1) + '%' : '--') + '</td>';
    html += '<td>' + fmt(a.gon) + '</td>';
    html += '<td>' + (a.gt > 0 ? a.onlinePctSell.toFixed(1) + '%' : '--') + '</td>';
    html += '<td>' + fmt(a.ft) + '</td>';
    html += '<td><span class="tag ' + BUY_TAG_CLASS[a.buyStage] + '">' + a.buyStage + '</span></td>';
    html += '<td><span class="tag ' + SELL_TAG_CLASS[a.sellStage] + '">' + a.sellStage + '</span></td>';
    html += '</tr>';
  });
  html += '</table></div></section>';

  return html;
}

// ═══════════════════════════════════════════════════════════════════════
// LEVEL 3: ACCOUNT DETAIL
// ═══════════════════════════════════════════════════════════════════════
function renderLevel3() {
  const a = DATA.find(x => x.n === state.account);
  if (!a) return '<section><h2>Account not found</h2></section>';

  const bs = buyFunnel(a);
  const ss = sellFunnel(a);
  const dl = a.gl ? daysSince(a.gl) : null;
  const totalConn = a.k2k;
  const activatedConn = a.av > 0 ? a.av : 0;
  const dormantConn = totalConn - activatedConn - a.ch;
  const activeConn = a.as > 0 ? Math.min(a.av, totalConn) : 0;

  // Header card
  let html = '<div class="header-card">';
  html += '<h2>' + esc(a.n) + '</h2>';
  html += '<div class="header-meta">';
  html += '<span><strong>Product:</strong> ' + esc(a.sys) + '</span>';
  html += '<span><strong>Impl:</strong> ' + esc(a.impl) + '</span>';
  if (a.cs) html += '<span><strong>CS:</strong> ' + esc(a.cs) + '</span>';
  html += '<span><strong>Status:</strong> ' + (a.lc || 'N/A') + '</span>';
  if (dl !== null) html += '<span><strong>Days since go-live:</strong> ' + dl + '</span>';
  html += '</div></div>';

  // Two panels
  html += '<div class="detail-panels">';

  // PANEL A: Compra online?
  html += '<div class="detail-panel">';
  html += '<h3>COMPRAR: <span class="tag ' + BUY_TAG_CLASS[bs] + '">' + bs + '</span></h3>';

  // Mini funnel
  html += '<div style="padding:10px;background:#f8fafc;border-radius:7px;margin-bottom:12px;font-size:13px">';
  html += '<strong>Connections:</strong> ' + totalConn + ' total';
  if (totalConn > 0) {
    html += ' | ' + activatedConn + ' activated | ' + (a.as > 0 ? 'Active in L30D' : '0 active') + ' | ' + a.ch + ' churned | ' + Math.max(0, dormantConn) + ' dormant';
  }
  html += '<br><strong>Stage:</strong> ' + bs;
  if (bs === 'Dormant') html += ' -- tiene conexiones pero no compra K2K';
  if (bs === 'No connections') html += ' -- sin conexiones K2K';
  if (bs === 'Active') html += ' -- comprando activamente en L30D';
  if (bs === 'Churned') html += ' -- tenia actividad pero dejo de comprar';
  if (bs === 'Activated') html += ' -- compro al menos una vez por K2K';
  html += '</div>';

  html += '<div class="metric-row"><span class="metric-label">Total Procurement</span><span class="metric-value">' + fmt(a.pt) + '</span></div>';
  html += '<div class="metric-row"><span class="metric-label">K2K Procurement</span><span class="metric-value">' + fmt(a.pk) + ' (' + pct(a.pk, a.pt) + ')</span></div>';
  html += '<div class="metric-row"><span class="metric-label">Vendors: Total / Active L30D</span><span class="metric-value">' + a.av + ' / ' + (a.as > 0 ? 'Yes' : 'No') + '</span></div>';
  html += '<div class="metric-row"><span class="metric-label">Active Vendor Spend L30D</span><span class="metric-value">' + fmt(a.as) + '</span></div>';
  html += '<div class="metric-row"><span class="metric-label">Churned Vendors</span><span class="metric-value">' + a.ch + '</span></div>';

  // Diagnostic
  html += '<div class="diagnostic">';
  if (bs === 'No connections') html += 'Sin conexiones K2K. Necesita supply -- conectar vendors relevantes.<em class="mock-tag">MOCK</em>';
  else if (bs === 'Dormant') html += 'Tiene conexiones pero $0 K2K. No compra? No intento? Intento y no encontro? Encontro y no compro?<span class="mock-tag">MOCK</span>';
  else if (bs === 'Churned') html += 'Tenia actividad pero dejo de comprar L30D. Se fue offline? No le gusto? No tiene necesidad?<span class="mock-tag">MOCK</span>';
  else if (bs === 'Activated') html += 'Compro al menos una vez. Se mantiene? Crece? Vendor diversity?<span class="mock-tag">MOCK</span>';
  else if (bs === 'Active') html += 'Comprando activamente. Se mantiene? Crece la spend? Diversifica vendors?<span class="mock-tag">MOCK</span>';
  html += '</div>';

  html += '<p style="margin-top:12px"><a href="procurement-framework-v6.html" style="font-size:13px">&#8594; Deep dive: Procurement Framework</a></p>';
  html += '</div>';

  // PANEL B: Vende online?
  html += '<div class="detail-panel">';
  html += '<h3>VENDER: <span class="tag ' + SELL_TAG_CLASS[ss] + '">' + ss + '</span></h3>';

  const onlinePct = a.gt > 0 ? (a.gon / a.gt * 100).toFixed(1) : '0.0';

  html += '<div style="padding:10px;background:#f8fafc;border-radius:7px;margin-bottom:12px;font-size:13px">';
  html += '<strong>eShop:</strong> ' + (a.gt > 0 ? 'YES' : 'NO');
  html += ' | <strong>Online GMV:</strong> ' + fmt(a.gon);
  html += ' | <strong>Online %:</strong> ' + onlinePct + '%';
  html += '<br><strong>Stage:</strong> ' + ss;
  if (ss === 'No eShop') html += ' -- sin ventas registradas';
  if (ss === 'No supply') html += ' -- tiene GMV total pero $0 online';
  if (ss === 'Low online') html += ' -- vende online pero <15% del total';
  if (ss === 'Growing') html += ' -- 15-50% online, en crecimiento';
  if (ss === 'Healthy') html += ' -- >50% online';
  html += '</div>';

  html += '<div class="metric-row"><span class="metric-label">Total GMV</span><span class="metric-value">' + fmt(a.gt) + '</span></div>';
  html += '<div class="metric-row"><span class="metric-label">Online GMV (eCom+API)</span><span class="metric-value">' + fmt(a.gon) + ' (' + onlinePct + '%)</span></div>';
  html += '<div class="metric-row"><span class="metric-label">K2K GMV</span><span class="metric-value">' + fmt(a.gk) + '</span></div>';
  html += '<div class="metric-row"><span class="metric-label">Offline GMV</span><span class="metric-value">' + fmt(a.goff) + '</span></div>';
  html += '<div class="metric-row"><span class="metric-label">TX Fees Total</span><span class="metric-value">' + fmt(a.ft) + '</span></div>';
  html += '<div class="metric-row"><span class="metric-label">TX Fees (eCom / K2K / API)</span><span class="metric-value">' + fmt(a.fe) + ' / ' + fmt(a.fk) + ' / ' + fmt(a.fa) + '</span></div>';

  // Diagnostic
  html += '<div class="diagnostic">';
  if (ss === 'No eShop') html += 'Sin ventas registradas. Cuando se implementa el eShop? Tiene infraestructura?<span class="mock-tag">MOCK</span>';
  else if (ss === 'No supply') html += 'Tiene GMV total pero $0 online. Que categorias faltan? Feature flags activos?<span class="mock-tag">MOCK</span>';
  else if (ss === 'Low online') html += 'Vende online pero bajo volumen (<15%). Supply buena pero nadie compra? Bunches online?<span class="mock-tag">MOCK</span>';
  else if (ss === 'Growing') html += 'Creciendo (15-50% online). Cuales categorias empujar? Bunches vs boxes gap?<span class="mock-tag">MOCK</span>';
  else if (ss === 'Healthy') html += 'Mas de 50% online. Se mantiene? Revenue diversificado? TX fees tracking?<span class="mock-tag">MOCK</span>';
  html += '</div>';

  html += '<p style="margin-top:12px"><a href="#" style="font-size:13px;color:var(--muted)">&#8594; Deep dive: Sell Framework (future)</a></p>';
  html += '</div>';
  html += '</div>'; // close detail-panels

  // Activity log (MOCK)
  html += '<div class="activity-log">';
  html += '<h3>Activity Log <span class="mock-tag">MOCK</span></h3>';
  html += '<div class="log-item"><strong>Fathom calls:</strong> Data available via Fathom MCP -- not loaded in this view</div>';
  html += '<div class="log-item"><strong>Cupido effort:</strong> Check Cupido dashboard for contact status</div>';
  html += '<div class="log-item"><strong>SFDC last activity:</strong> Check SFDC for recent activities</div>';
  html += '</div>';

  return html;
}

// ═══════════════════════════════════════════════════════════════════════
// MAIN RENDER
// ═══════════════════════════════════════════════════════════════════════
function render() {
  renderBreadcrumb();
  const app = document.getElementById('app');
  switch(state.level) {
    case 0: app.innerHTML = renderLevel0(); break;
    case 1: app.innerHTML = renderLevel1(); break;
    case 2: app.innerHTML = renderLevel2(); break;
    case 3: app.innerHTML = renderLevel3(); break;
  }
  window.scrollTo(0, 0);
}

// Initial render
render();
</script>
</main>
</body>
</html>
