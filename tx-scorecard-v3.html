const fmtK = n => n == null ? '\u2014' : n >= 1000000 ? '$' + (n/1000000).toFixed(1) + 'M' : n >= 1000 ? '$' + (n/1000).toFixed(1) + 'K' : '$' + Math.round(n).toLocaleString();

// ============================================
// FILTER STATE
// ============================================
const filterState = {
  product: 'All',
  status: 'All',
  buyStage: 'All',
  sellStage: 'All'
};

// Derive product from sys field
function getProducts(sys) {
  if (!sys) return [];
  const products = [];
  if (sys.includes('Komet Core')) products.push('Komet Core');
  if (sys.includes('eSuite')) products.push('eSuite Wholesaler');
  if (sys.includes('Koronet Procurement')) products.push('Koronet Procurement');
  if (sys.includes('K2K E-Commerce')) products.push('K2K E-Commerce');
  if (sys.includes('FCS')) products.push('FCS');
  return products;
}

function matchesProduct(acct) {
  if (filterState.product === 'All') return true;
  return getProducts(acct.sys).includes(filterState.product);
}

function matchesStatus(acct) {
  if (filterState.status === 'All') return true;
  if (filterState.status === 'Past Due') return !acct.lc || acct.lc === '';
  return acct.lc === filterState.status;
}

// Buy stage: derive from K2K connections + procurement data
function getBuyStage(acct) {
  if (acct.k2k === 0 && acct.pt === 0) return 'No Connections';
  if (acct.k2k > 0 && acct.pt === 0 && acct.pk === 0) return 'Dormant';
  if (acct.pk > 0 && acct.pk > acct.pt * 0.1) return 'Active';
  if (acct.pk > 0) return 'Activated';
  if (acct.pt > 0 && acct.pk === 0) return 'Churned';
  return 'No Connections';
}

function matchesBuyStage(acct) {
  if (filterState.buyStage === 'All') return true;
  return getBuyStage(acct) === filterState.buyStage;
}

// Sell stage: derive from GMV data
function getSellStage(acct) {
  if (acct.gon === 0 && acct.goff === 0) return 'No Sales';
  if (acct.gon === 0 && acct.goff > 0) return 'Offline Only';
  const onlinePct = acct.gt > 0 ? (acct.gon / acct.gt * 100) : 0;
  if (onlinePct < 15) return 'Low Online';
  if (onlinePct < 50) return 'Growing';
  return 'Healthy';
}

function matchesSellStage(acct) {
  if (filterState.sellStage === 'All') return true;
  return getSellStage(acct) === filterState.sellStage;
}

function matchesAllFilters(acct) {
  return matchesProduct(acct) && matchesStatus(acct) && matchesBuyStage(acct) && matchesSellStage(acct);
}

function getFilteredAccounts() {
  return ACCOUNTS.filter(matchesAllFilters);
}

function groupBy(accounts, field) {
  const groups = {};
  accounts.forEach(a => {
    const key = a[field] || '(Unassigned)';
    if (!groups[key]) groups[key] = [];
    groups[key].push(a);
  });
  return groups;
}

  const buyStage = getBuyStage(a);

  const buySignal = buyStage === 'Active' ? 'ok' : buyStage === 'Activated' ? 'warn' : buyStage === 'Dormant' ? 'warn' : 'bad';
  const sellSignal = sellStage === 'Healthy' ? 'ok' : sellStage === 'Growing' ? 'ok' : sellStage === 'Low Online' ? 'warn' : 'bad';
  const statusDot = a.lc === 'Adoption' ? 'green' : a.lc === 'Onboarding' ? 'yellow' : 'gray';
  return `<tr>

// ============================================
// WHOLESALER SCORECARD — H1 2026
// ============================================
function renderWholesalerScorecard() {
  const filtered = getFilteredAccounts();
  const headerLabel = currentView === 'impl' ? 'Implementation Lead' : currentView === 'cs' ? 'CS Advisor' : 'Owner';
  const groupField = currentView === 'impl' ? 'impl' : currentView === 'cs' ? 'cs' : 'impl';

  let drillHTML = '';

  if (currentView === 'all') {
    // Flat table, all reps
    drillHTML = `<div class="tableWrap"><table class="drill-table">
      <tr><th>Account</th><th>Status</th><th class="num">K2K Conn</th><th class="num">Procure Total</th><th class="num">Procure K2K</th><th class="num">Fees Total</th><th class="num">GMV Online</th><th class="num">GMV Offline</th><th class="num">GMV Total</th><th>Buy Stage</th><th>Sell Stage</th></tr>
      ${filtered.map(a => renderAccountRow(a)).join('')}
    </table></div>`;
  } else {
    // Grouped by owner
    const groups = groupBy(filtered, groupField);
    const sortedOwners = Object.keys(groups).sort((a,b) => {
      const aGT = groups[a].reduce((s,x) => s + x.gt, 0);
      const bGT = groups[b].reduce((s,x) => s + x.gt, 0);
      return bGT - aGT;
    });

    drillHTML = sortedOwners.map(owner => {
      const accts = groups[owner];
      return `<div class="layer"><div class="layer-header" onclick="this.parentElement.classList.toggle('open')">
        <span>${owner} <span class="acct-count-badge">${accts.length} accounts</span> | GMV: ${fmtK(accts.reduce((s,a) => s + a.gt, 0))} | Fees: ${fmtK(accts.reduce((s,a) => s + a.ft, 0))}</span><span class="layer-arrow">&#9654;</span></div>
        <div class="layer-body"><div class="tableWrap"><table class="drill-table">
          <tr><th>Account</th><th>Status</th><th class="num">K2K Conn</th><th class="num">Procure Total</th><th class="num">Procure K2K</th><th class="num">Fees Total</th><th class="num">GMV Online</th><th class="num">GMV Offline</th><th class="num">GMV Total</th><th>Buy Stage</th><th>Sell Stage</th></tr>
          ${renderOwnerSummaryRow(owner, accts)}
          ${accts.map(a => renderAccountRow(a)).join('')}
        </table></div></div></div>`;
    }).join('');
  }

  return `<section>
    <div class="section-period">WHOLESALER SCORECARD <span class="period-badge">H1 2026 (Jan 1 - Jun 30)</span></div>
    <p class="eyebrow">Account Drill-Down</p>
    <h2>Wholesaler Scorecard by ${headerLabel}</h2>
    <p class="sub">All account-level data covers H1 2026 (Jan 1 - Jun 30, 2026). Drill down by ${currentView === 'impl' ? 'Implementation Lead' : currentView === 'cs' ? 'CS Advisor' : 'all owners'}. Use the filters above to slice by Product, Status, Buy Stage, or Sell Stage.</p>
    ${renderViewTabs()}
    ${drillHTML}
  </section>`;
}

        <strong style="color:var(--purple)">${fmtNum(BUYER_COHORTS.reduce((s,r) => s + r.totalBuyers, 0))} buyers</strong>

      </div>
    </div>
  </section>`;
}
